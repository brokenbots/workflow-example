name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-tests:
    name: Go tests (criteria-k8s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: criteria-k8s/go.mod
          cache: true
          cache-dependency-path: criteria-k8s/go.sum

      - name: Build
        working-directory: criteria-k8s
        run: go build ./...

      - name: Vet
        working-directory: criteria-k8s
        run: go vet ./...

      - name: Test
        working-directory: criteria-k8s
        run: go test ./... -count=1

  k8s-shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run k8s manifest shell tests
        run: |
          for t in k8s/tests/test_*.sh; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done

      - name: Run engine pin regression test (CRI-140)
        run: |
          bash linear_intake_v1/tests/test_engine_pin.sh

      # Mirrors linear_intake_v1/Dockerfile: same pinned release, verified
      # against the release SHA256SUMS before install.
      - name: Install criteria v0.5.22 (SHA256SUMS-verified)
        run: |
          version="v0.5.22"
          archive="criteria-${version}-linux-amd64.tar.gz"
          base="https://github.com/brokenbots/criteria/releases/download/${version}"
          curl -fL "${base}/${archive}" -o "/tmp/${archive}"
          curl -fL "${base}/SHA256SUMS" -o /tmp/criteria-checksums.txt
          (cd /tmp && grep " ${archive}$" criteria-checksums.txt | sha256sum -c -)
          mkdir -p /tmp/criteria-install
          tar -xzf "/tmp/${archive}" -C /tmp/criteria-install
          sudo install -m 0755 /tmp/criteria-install/criteria /usr/local/bin/criteria
          rm -rf "/tmp/${archive}" /tmp/criteria-checksums.txt /tmp/criteria-install

      # Mirrors linear_intake_v1/Dockerfile: pre-pull the two adapter binaries
      # that linear_triage_v1/.criteria.lock.hcl and
      # linear_develop_v1/.criteria.lock.hcl pin, so `criteria validate`
      # can resolve and verify their schemas from the runner's local cache.
      - name: Pre-pull triage adapter binaries into the criteria cache
        env:
          CRITERIA_HOME: /home/runner/.local/criteria
        run: |
          mkdir -p "$CRITERIA_HOME/adapters"
          criteria adapter pull ghcr.io/brokenbots/criteria-adapter-shell:0.5.3
          criteria adapter pull ghcr.io/brokenbots/criteria-adapter-copilot:0.5.6

      - name: Run linear_triage_v1 standalone extraction regression test (CRI-238)
        run: |
          bash linear_triage_v1/tests/test_triage_standalone.sh

      - name: Run linear_develop_v1 standalone extraction regression test (CRI-239)
        run: |
          bash linear_develop_v1/tests/test_develop_standalone.sh

  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install kubectl
        run: |
          curl -fL "https://dl.k8s.io/release/$(curl -fL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o /usr/local/bin/kubectl
          chmod +x /usr/local/bin/kubectl

      - name: Validate YAML manifests
        run: |
          for f in k8s/*.yaml; do
            kubectl apply --dry-run=client -f "$f" > /dev/null 2>&1 || true
            # Structural validation only (no cluster): python yaml parse catches syntax errors.
            # Use safe_load_all so files with multiple YAML documents validate.
            python3 -c "import yaml, sys; list(yaml.safe_load_all(open('$f')))" || exit 1
            echo "OK: $f"
          done