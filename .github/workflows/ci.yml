name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-tests:
    name: Go tests (criteria-k8s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: criteria-k8s/go.mod
          cache: true
          cache-dependency-path: criteria-k8s/go.sum

      - name: Build
        working-directory: criteria-k8s
        run: go build ./...

      - name: Vet
        working-directory: criteria-k8s
        run: go vet ./...

      - name: Test
        working-directory: criteria-k8s
        run: go test ./... -count=1

  k8s-shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run k8s manifest shell tests
        run: |
          for t in k8s/tests/test_*.sh; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done

      - name: Run engine pin regression test (CRI-140)
        run: |
          bash linear_intake_v1/tests/test_engine_pin.sh

      # Source-mode test tooling for this suite. Rolled to v0.5.32 (b2d0b66)
      # in CRI-300: the flat WorkflowGraphs shape only exists from this
      # release onward, and the smoke test below (test_workflow_graphs_flat.sh)
      # asserts that emitter contract. This does NOT change the image-mode
      # pin in linear_intake_v1/Dockerfile (still v0.5.22, coordinator-owned).
      - name: Install criteria v0.5.32 (SHA256SUMS-verified)
        run: |
          version="v0.5.32"
          archive="criteria-${version}-linux-amd64.tar.gz"
          base="https://github.com/brokenbots/criteria/releases/download/${version}"
          curl -fL "${base}/${archive}" -o "/tmp/${archive}"
          curl -fL "${base}/SHA256SUMS" -o /tmp/criteria-checksums.txt
          (cd /tmp && grep " ${archive}$" criteria-checksums.txt | sha256sum -c -)
          mkdir -p /tmp/criteria-install
          tar -xzf "/tmp/${archive}" -C /tmp/criteria-install
          sudo install -m 0755 /tmp/criteria-install/criteria /usr/local/bin/criteria
          rm -rf "/tmp/${archive}" /tmp/criteria-checksums.txt /tmp/criteria-install

      # Mirrors linear_intake_v1/Dockerfile: pre-pull the two adapter binaries
      # that linear_triage_v1/.criteria.lock.hcl and
      # linear_develop_v1/.criteria.lock.hcl pin, so `criteria validate`
      # can resolve and verify their schemas from the runner's local cache.
      - name: Pre-pull triage adapter binaries into the criteria cache
        env:
          CRITERIA_HOME: /home/runner/.local/criteria
        run: |
          mkdir -p "$CRITERIA_HOME/adapters"
          criteria adapter pull ghcr.io/brokenbots/criteria-adapter-shell:0.5.3
          criteria adapter pull ghcr.io/brokenbots/criteria-adapter-copilot:0.5.8

      - name: Run linear_triage_v1 standalone extraction regression test (CRI-238)
        run: |
          bash linear_triage_v1/tests/test_triage_standalone.sh

      - name: Run linear_develop_v1 standalone extraction regression test (CRI-239)
        run: |
          bash linear_develop_v1/tests/test_develop_standalone.sh

      # CRI-310: the dirty-label cleanup workflow (carrier for CRI-246,
      # validation run C) — minimal single-adapter tree, fired through the
      # criteria-cleanup route on a criteria-dirty ticket.
      - name: Run ticket_cleanup_v1 standalone regression test (CRI-310)
        run: |
          bash ticket_cleanup_v1/tests/test_cleanup_standalone.sh

      # CRI-300: pin the flat WorkflowGraphs emitter contract on the v0.5.32
      # engine (skips cleanly on engines that predate the event).
      - name: Run flat WorkflowGraphs shape smoke test (CRI-300)
        run: |
          bash linear_intake_v1/tests/test_workflow_graphs_flat.sh

      # The adapter binaries pre-pulled above match workstream_handler_v1's
      # lockfile pins, so structural compile tests can resolve them locally.
      - name: Run workstream_handler_v1 regression tests
        run: |
          for t in workstream_handler_v1/tests/test_*.sh; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done

  secret-free-gate:
    name: Secret-free shipped configs (CRI-250)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the deterministic secret grep gate (plan CRI-214 3.8)
        run: |
          bash k8s/tests/test_secret_free_gate.sh

  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install kubectl
        run: |
          curl -fL "https://dl.k8s.io/release/$(curl -fL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o /usr/local/bin/kubectl
          chmod +x /usr/local/bin/kubectl

      - name: Validate YAML manifests
        run: |
          for f in k8s/*.yaml; do
            kubectl apply --dry-run=client -f "$f" > /dev/null 2>&1 || true
            # Structural validation only (no cluster): python yaml parse catches syntax errors.
            # Use safe_load_all so files with multiple YAML documents validate.
            python3 -c "import yaml, sys; list(yaml.safe_load_all(open('$f')))" || exit 1
            echo "OK: $f"
          done