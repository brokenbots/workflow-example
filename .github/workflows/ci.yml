name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-tests:
    name: Go tests (criteria-k8s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: criteria-k8s/go.mod
          cache: true
          cache-dependency-path: criteria-k8s/go.sum

      - name: Build
        working-directory: criteria-k8s
        run: go build ./...

      - name: Vet
        working-directory: criteria-k8s
        run: go vet ./...

      - name: Test
        working-directory: criteria-k8s
        run: go test ./... -count=1

      # The repo root is a Go module whose repogate/ package pins the
      # gate-contract make targets the develop-loop ci_gate line invokes
      # (`make build && make lint-go && make validate && go test ./...`);
      # this root-level leg mirrors that gate leg so contract drift fails in
      # CI too, not only at fire time. ./... here matches only the root
      # module (nested criteria-k8s is its own module, covered above).
      - name: Repo gate-anchor tests (root module)
        run: go test ./... -count=1

  k8s-shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Source-mode test tooling for this suite. Rolled to v0.5.32 (b2d0b66)
      # in CRI-300: the flat WorkflowGraphs shape only exists from this
      # release onward, and the smoke test below (test_workflow_graphs_flat.sh)
      # asserts that emitter contract. Rolled again to v0.5.44 (37fd6e5+): the
      # require_comment outcome attribute (KB-45) landed in v0.5.42, and the
      # KB-217 tree contracts (outcome arms whose adapter reason renders into
      # a downstream step's input) need an engine that parses and enforces it.
      # The trees remain compile-compatible with v0.5.32+ engines.
      # Installed before the k8s/tests loop: KB-240's
      # test_env_listen_ports.sh drives the real engine (port-0 shim binds),
      # and the loop runs every k8s/tests/test_*.sh it finds.
      - name: Install criteria v0.5.52-rc4 (SHA256SUMS-verified)
        run: |
          version="v0.5.52-rc4"
          archive="criteria-${version}-linux-amd64.tar.gz"
          base="https://github.com/brokenbots/criteria/releases/download/${version}"
          curl -fL "${base}/${archive}" -o "/tmp/${archive}"
          curl -fL "${base}/SHA256SUMS" -o /tmp/criteria-checksums.txt
          (cd /tmp && grep " ${archive}$" criteria-checksums.txt | sha256sum -c -)
          mkdir -p /tmp/criteria-install
          tar -xzf "/tmp/${archive}" -C /tmp/criteria-install
          sudo install -m 0755 /tmp/criteria-install/criteria /usr/local/bin/criteria
          rm -rf "/tmp/${archive}" /tmp/criteria-checksums.txt /tmp/criteria-install

      # Pre-pull the adapter binaries that kanboard_triage_v1/.criteria.lock.hcl
      # and kanboard_develop_v1/.criteria.lock.hcl pin, so `criteria validate`
      # can resolve and verify their schemas from the runner's local cache.
      - name: Pre-pull triage adapter binaries into the criteria cache
        env:
          CRITERIA_HOME: /home/runner/.local/criteria
        run: |
          mkdir -p "$CRITERIA_HOME/adapters"
          criteria adapter pull ghcr.io/brokenbots/criteria-adapter-shell:0.5.5
          criteria adapter pull ghcr.io/brokenbots/criteria-adapter-copilot:0.5.15

      # The copilot adapter's CLI server execs the `copilot` CLI from PATH
      # (run 39098317753: bind adapter "copilot.main" ... "failed to start
      # CLI server: exec: "copilot": executable file not found in $PATH").
      # Install the npm CLI — version-pinned to 1.0.82, the build the KB-277
      # contracts suite was proven against. Its model traffic is aimed at the
      # suite's scripted stub via adapters_shim.mjs (provider wire pinned in
      # the fixture tree), so no live GitHub model access is needed; the local
      # suite passes with a dummy token under exactly this CLI.
      - name: Install Copilot CLI for copilot.main binding
        run: sudo npm install -g @github/copilot@1.0.82

      - name: Run k8s manifest shell tests
        run: |
          for t in k8s/tests/test_*.sh; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done

      # KB-231: the kanboard trees must fail deterministically on dead-board
      # outages (empty / HTML-302 RPC bodies) with the failing stage named,
      # and their standalone suites cover those outage bodies.
      - name: Run kanboard_develop_v1 standalone extraction regression test (KB-231)
        run: |
          bash kanboard_develop_v1/tests/test_develop_standalone.sh

      - name: Run kanboard_triage_v1 standalone extraction regression test (KB-231)
        run: |
          bash kanboard_triage_v1/tests/test_triage_standalone.sh

      # CRI-310: the dirty-label cleanup workflow (carrier for CRI-246,
      # validation run C) — minimal single-adapter tree, fired through the
      # criteria-cleanup route on a criteria-dirty ticket.
      - name: Run ticket_cleanup_v1 standalone regression test (CRI-310)
        run: |
          bash ticket_cleanup_v1/tests/test_cleanup_standalone.sh

      # KB-276: the harness wire/transport tree (matrix A1-A6 + B7-B12) —
      # compile-level gate over the deterministic 2-env 2-kind probe tree
      # (handshake, digest pins, identity grammar, scope sets, graph-carrier
      # composition); route-prep wiring rides the routes-configmap test.
      - name: Run harness_wire_v1 standalone regression test (KB-276)
        run: |
          bash harness_wire_v1/tests/test_wire_standalone.sh

      # KB-205 / ADR-0013: decision-demo worktrees — the System One
      # classification+routing demo and its backend-agnostic localhost
      # variant. Compile-level gate over both trees (arm order, every
      # answer type in routing, confidence-gate approval path, credential
      # discipline); the runtime depth lives in
      # decision_demo_local_v1/tests/ and skips without the unpublished
      # decision adapter binary.
      - name: Run decision demo compile-level regression test (KB-205)
        run: |
          bash decision_demo_v1/tests/test_decision_demo_standalone.sh

      # CRI-300: pin the flat WorkflowGraphs emitter contract on the v0.5.32
      # engine (skips cleanly on engines that predate the event).
      - name: Run flat WorkflowGraphs shape smoke test (CRI-300)
        run: |
          bash k8s/tests/test_workflow_graphs_flat.sh

      # KB-277: the contracts harness (matrix C13-C18 + D19/D21/D22) —
      # per-shape fixture runs over a scripted local model stub; each matrix
      # shape asserted in run events. Skips cleanly without the pinned
      # adapter binaries (pre-pulled above). Gate integrity: a green suite
      # that skipped would prove nothing, so the run must show the
      # all-shapes-observed banner from actual observations.
      - name: Run harness_contracts_v1 standalone regression test (KB-277)
        env:
          SUITE_DEBUG: "1"
        run: |
          set -o pipefail
          bash harness_contracts_v1/tests/test_contracts_standalone.sh \
            2>&1 | tee /tmp/kb277_suite.log
          banner='harness_contracts_v1 standalone suite: all fixture shapes observed in run events'
          if ! grep -qF "$banner" /tmp/kb277_suite.log; then
            echo "::error::harness_contracts_v1 suite skipped (pinned adapters absent at run time) — gate coverage silently lost; restore the pre-pull"
            exit 1
          fi

      # KB-278: the composition harness (matrix G1-G12 + G10's re-assert of
      # B7/B9) — the compiled WorkflowGraphs shape and source pins over the
      # embedded callee env grouping, iteration-body env, parallel guard,
      # ADR-0009 substitution pair, alias-ledger dial pair, and the two
      # composition KNOWN-GAP fixtures. The pinned copilot binary
      # (pre-pulled above) arms the G5-fixture compile-time parallel_safe
      # refusal the suite asserts. Skips cleanly without the engine; gate
      # integrity: a skipped run must fail the all-shapes banner check.
      - name: Run harness_composition_v1 standalone regression test (KB-278)
        env:
          SUITE_DEBUG: "1"
        run: |
          set -o pipefail
          bash harness_composition_v1/tests/test_composition_standalone.sh \
            2>&1 | tee /tmp/kb278_suite.log
          banner='harness_composition_v1 standalone suite: all matrix shapes asserted (compile + source pins green)'
          if ! grep -qF "$banner" /tmp/kb278_suite.log; then
            echo "::error::harness_composition_v1 suite skipped (criteria/jq absent at run time) — gate coverage silently lost; restore the toolchain"
            exit 1
          fi

      # KB-279 (failures leg, series leg armed on dave's go): the engineered
      # failure-path fixtures execute in-run — every failure must land in its
      # DESIGNED CLASS marker (stall watchdog, bounded-retry park, iteration
      # failure, class registry, E24 wedge shape, G12 silent traversal flip,
      # E30 admission pin refusals observed against a throwaway TLS archive
      # server built at suite time). Gate integrity: a skipped run must fail
      # the all-shapes banner check.
      - name: Run harness_failures_v1 standalone regression test (KB-279)
        env:
          SUITE_DEBUG: "1"
        run: |
          set -o pipefail
          bash harness_failures_v1/tests/test_failures_standalone.sh \
            2>&1 | tee /tmp/kb279_suite.log
          banner='harness_failures_v1 standalone suite: all failure shapes asserted (compile + probes + fixtures + admission pins green)'
          if ! grep -qF "$banner" /tmp/kb279_suite.log; then
            echo "::error::harness_failures_v1 suite skipped (criteria/jq/go absent at run time) — gate coverage silently lost; restore the toolchain"
            exit 1
          fi

      # KB-280 (fleet-smoke leg, series leg armed on dave's go): the
      # fast-feedback canary — identity handshake, pinned green step,
      # engineered A2-miss admission refusal, boot-manifest shape asserts.
      # Gate integrity: the suite's green banner is conditional on the
      # A2-miss OBSERVATION leg (a skipped refusal refuses the banner), so a
      # banner-grep here cannot pass a silently-skipped suite.
      - name: Run harness_fleet_smoke_v1 standalone regression test (KB-280)
        env:
          SUITE_DEBUG: "1"
        run: |
          set -o pipefail
          bash harness_fleet_smoke_v1/tests/test_fleet_smoke_standalone.sh \
            2>&1 | tee /tmp/kb280_suite.log
          banner='harness_fleet_smoke_v1 standalone suite: all canary shapes asserted (compile + probes + pin gates + route wiring green)'
          if ! grep -qF "$banner" /tmp/kb280_suite.log; then
            echo "::error::harness_fleet_smoke_v1 suite skipped (criteria/jq absent at run time) — gate coverage silently lost; restore the toolchain"
            exit 1
          fi

      # The adapter binaries pre-pulled above match workstream_handler_v1's
      # lockfile pins, so structural compile tests can resolve them locally.
      - name: Run workstream_handler_v1 regression tests
        run: |
          for t in workstream_handler_v1/tests/test_*.sh; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done

      # KB-219: the shared gh retry wrapper is consumed by every GH call site
      # (workstream_handler_v1 loop above, plus devops_triage_v1's open_pr) —
      # keep their integration tests gated.
      - name: Run devops_triage_v1 open_pr retry test (KB-219)
        run: |
          bash devops_triage_v1/tests/test_open_pr_retry.sh

  secret-free-gate:
    name: Secret-free shipped configs (CRI-250)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the deterministic secret grep gate (plan CRI-214 3.8)
        run: |
          bash k8s/tests/test_secret_free_gate.sh

  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install kubectl
        run: |
          curl -fL "https://dl.k8s.io/release/$(curl -fL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o /usr/local/bin/kubectl
          chmod +x /usr/local/bin/kubectl

      - name: Validate YAML manifests
        run: |
          for f in k8s/*.yaml; do
            kubectl apply --dry-run=client -f "$f" > /dev/null 2>&1 || true
            # Structural validation only (no cluster): python yaml parse catches syntax errors.
            # Use safe_load_all so files with multiple YAML documents validate.
            python3 -c "import yaml, sys; list(yaml.safe_load_all(open('$f')))" || exit 1
            echo "OK: $f"
          done