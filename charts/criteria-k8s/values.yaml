# Default values for the criteria-k8s chart.
# These defaults mirror the hand-applied manifests in k8s/ and the operator
# install manifest, so `helm template` output stays diff-reviewable against
# the previous kubectl-apply flow.

# Target namespace for every namespaced resource in the chart. Helm does not
# create it: install with --create-namespace (or set namespaceCreate=true to
# render a Namespace object with the pod-security labels applied).
# Caution: a non-empty value overrides the helm -n flag; keep -n aligned with
# this value, or set it to "" to follow the release namespace.
namespace: criteria-jobs

# Render a Namespace object (with pod-security labels) from the chart instead
# of relying on helm's --create-namespace, which creates a bare namespace.
namespaceCreate: false

# Pod Security Standard label applied to the rendered Namespace when
# namespaceCreate=true. The criteria-jobs namespace runs remote-mode workflow
# pods unprivileged, so the baseline profile applies (mirrors
# k8s/00-namespace.yaml). Cluster notes (k8s/PHASE2-HANDOFF.md) describe the
# namespace as enforcing restricted; if your environment enforces restricted,
# override with --set podSecurity.enforce=restricted.
podSecurity:
  enforce: baseline

images:
  # criteria-k8s binary image: the operator (/manager) and the kanboard
  # watcher deployment — a raw overlay applied from k8s/kanboard-watcher.yaml,
  # not templated here — (/kanboard-watcher) both run this image with different
  # entrypoints. The criteria-linear-watcher (/linear-watcher) was retired
  # 2026-10-09 (KB-228; Linear cutover complete).
  operator:
    repository: localhost:5000/criteria-k8s
    tag: dev
    pullPolicy: IfNotPresent
  # Criteria workflow image the operator passes to runner Jobs (via
  # DEFAULT_CRITERIA_IMAGE / CRITERIA_IMAGE) and the kanboard-watcher
  # records in CriteriaRuns (the linear-watcher did until its 2026-10-09
  # retirement).
  workflow:
    repository: localhost:5000/linear-intake-remote
    tag: dev
  # Source-mode base image (CRI-230): minimal criteria image that
  # spec.workflowSource runs execute on when the run spec carries no image
  # (url-only source mode; url+image runs stamp their own process image).
  criteriaBase:
    repository: localhost:5000/criteria-base
    tag: dev
  # Adapter image fallback (CRI-214 M14): the registry host and default tag
  # for adapter image references the operator composes itself — the fallback
  # when neither the workflow object's adapterImages override nor the
  # provision_wanted event's digest-verified image_reference resolves one.
  # KB-214: the repo name carries the pod shape — legacy per-adapter
  # fallback pods resolve criteria-adapter-<kind>:<tag> (adapter.sh +
  # remote-runner shim), peer pods resolve
  # criteria-adapter-<kind>-peer:<tag> ('criteria peer' ENTRYPOINT,
  # Dockerfile.peer). Both shapes read these same values.
  adapter:
    registry: localhost:5000
    tag: k8s-3

# Operator: reconciles CriteriaRun resources into runner/adapter Jobs and
# sweeps expired per-ticket artifacts off the data PVC.
operator:
  enabled: true
  replicaCount: 1
  # Retention sweep for per-ticket intake/triage artifacts on the data PVC.
  # "0s" disables sweeping. Durations use Go time.ParseDuration units.
  retentionPeriod: 168h # 7d
  retentionInterval: 1h
  # KB-309: archived-terminal CriteriaRun retention. Deleting an archived
  # terminal run loses nothing (castle's run archive holds the history) but
  # bounds the operator's live memory of finished work. 0 days disables the
  # sweep; the keep-last floor protects the newest terminal runs per ticket
  # family for failure forensics; the namespace list opts namespaces in for
  # deletion (comma separated; empty keeps the sweep entirely inert), so
  # cutovers flip it on per namespace after their archive leg verifies.
  crRetentionDays: 7
  crRetentionKeepLast: 3
  crRetentionNamespaces: ""
  # Ollama-compatible provider endpoint handed to adapter workflows.
  providerBaseUrl: http://192.168.17.116:11434/v1
  # Castle observation (CRI-135): the operator polls the castle ServerService
  # API for run/adapter lifecycle instead of reading events.ndjson off the
  # data PVC. Empty disables observation (Job conditions only).
  castleAddr: http://castle:8080
  # KB-344: the port hosting the operator's run-event proxy (the boot gate
  # listener). Runner Jobs dial http://criteria-k8s-operator.<ns>.svc:<port>
  # as CASTLE_ADDR and speak the criteria protocol to the operator — run
  # pods never receive a castle address or credential. 0 disables the proxy
  # lane entirely (runners fall back to their local events file).
  runEventsPort: 8082
  # Castle run-archive token (KB-314) via OpenBao CSI — the ONLY chart
  # posture for secret material (CRI-250: no templated Secrets). Set the
  # name of the SecretProviderClass rendered into the namespace; the
  # operator mounts it and reads the token file via CASTLE_TOKEN_FILE
  # (openbao.castleTokenKey sets the file name). Empty keeps the archive
  # leg off: castle rejects anonymous ArchiveRun calls, so the operator
  # logs the gap loudly at startup and the backfill mode refuses to claim
  # coverage. Observation reads stay anonymous either way (dev posture).
  castleTokenSpc: ""
  # kubernetes.io/arch nodeSelector value stamped on child Job/pod templates
  # (runner + per-scope adapters): the arch of the nodes workflow pods
  # schedule on. A cluster property — set it to arm64 for an arm64 cluster.
  jobArch: amd64
  # Opt-in built-in legacy secret volumes (KB-3): a run without a stamped
  # workflow mounts only the data + scripts volumes unless this is true.
  # The built-in linear-spc/copilot-spc CSI volumes require the Secrets
  # Store CSI driver; set true only on an OpenBao-equipped cluster that
  # still runs workflow-less runs.
  legacySecretVolumes: false
  # Stall watchdog (KB-24): a Running run whose castle stream shows no step
  # progress for this long is failed with a StallWatchdog condition so
  # CriteriaRun reflects Failed instead of hanging in Running. Progress is
  # agent-activity aware (lifecycle envelopes plus the copilot adapter's
  # AdapterEvents; heartbeats and adapter bookkeeping chatter never count),
  # so the clock measures time since the newest activity event, not step
  # duration: healthy copilot turns emit agent events continuously (worst
  # observed gap 217s, gate-held permission waits ~10m), far inside this
  # window, while shipped step budgets above it (60m copilot develop/review
  # turns) stay reachable. "0s" disables the watchdog. Durations use Go
  # time.ParseDuration units.
  stallWindow: 30m
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

# The criteria-linear-watcher Deployment (and its `watcher.*` values) was
# removed from this chart on 2026-10-09 — Linear→Kanboard cutover complete
# (KB-228). Ticket polling now ships as the raw kanboard-watcher overlay
# (k8s/kanboard-watcher.yaml), not as a chart deployment.

# Castle control plane: single replica with persistent SQLite storage.
# Castle tolerates the k3s control-plane taint so it can run on a
# single-node cluster; it only needs CPU.
castle:
  enabled: true
  image:
    repository: localhost:5000/castle
    tag: dev
    pullPolicy: Always
  port: 8080
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

# PVCs shared by the stack. Names must stay aligned with the operator: the
# data PVC name is passed to the operator (CRITERIA_DATA_PVC) and the runner
# Jobs it creates mount it.
pvc:
  # Intake/triage artifacts and per-run discovery files.
  data:
    name: criteria-data
    size: 10Gi
    storageClass: local-path
  # Shared clone workspace for adapter Jobs. Informational only: the operator
  # does not consume this value (clones live under /data on the data PVC), so
  # overriding the name changes the rendered PVC but has no effect on child
  # Jobs.
  repo:
    name: criteria-repo
    size: 10Gi
    storageClass: local-path

# OpenBao CSI provider settings for the SecretProviderClasses. The OpenBao
# server, kubernetes auth role and policy are external prerequisites and are
# intentionally not templated here.
openbao:
  provider: openbao
  roleName: criteria-jobs
  secretPath: criteria/data/linear
  # KB-314: the castle criteria token lane (operator.castleTokenSpc renders
  # a dedicated SecretProviderClass reading this path/key; the token file
  # name inside the CSI mount equals castleTokenKey).
  castleTokenKey: castle_criteria_token

# Pod security context shared by the operator and castle pods (restricted
# compliance: non-root, no escalation, RuntimeDefault seccomp).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# Scheduling: keep control-plane components on amd64 nodes and tolerate the
# k3s catch taint, matching the operator install manifest.
nodeSelector:
  kubernetes.io/arch: amd64

tolerations:
  - key: catch
    operator: Exists
    effect: NoSchedule