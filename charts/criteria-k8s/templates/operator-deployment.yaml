# criteria-k8s operator: reconciles CriteriaRun resources into runner and
# adapter Jobs and sweeps expired per-ticket artifacts off the data PVC.
{{- if .Values.operator.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: criteria-k8s-operator
  namespace: {{ include "criteria-k8s.namespace" . }}
  labels:
    {{- include "criteria-k8s.labels" . | nindent 4 }}
    app.kubernetes.io/name: criteria-k8s-operator
    app.kubernetes.io/component: operator
spec:
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: criteria-k8s-operator
  template:
    metadata:
      labels:
        {{- include "criteria-k8s.labels" . | nindent 8 }}
        app.kubernetes.io/name: criteria-k8s-operator
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: criteria-k8s-operator
      {{- include "criteria-k8s.scheduling" . | nindent 6 }}
      {{- include "criteria-k8s.podSecurityContext" . | nindent 6 }}
      containers:
        - name: operator
          image: "{{ .Values.images.operator.repository }}:{{ .Values.images.operator.tag }}"
          imagePullPolicy: {{ .Values.images.operator.pullPolicy }}
          command: ["/manager"]
          # The namespace flag scopes the manager's caches and queue recovery
          # to the managed namespace; the operator's Role grants no
          # cluster-scope access.
          args:
            - --namespace
            - {{ include "criteria-k8s.namespace" . | quote }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          env:
            # Retention sweep: keep per-ticket intake/triage artifacts this
            # long after the last write (0s disables sweeping).
            - name: RETENTION_PERIOD
              value: {{ .Values.operator.retentionPeriod | quote }}
            - name: RETENTION_INTERVAL
              value: {{ .Values.operator.retentionInterval | quote }}
            # KB-309: archived-terminal CriteriaRun retention. 0 days
            # disables the sweep; the namespace list opts namespaces in for
            # deletion (the sweep is inert in namespaces not listed).
            - name: CR_RETENTION_DAYS
              value: {{ .Values.operator.crRetentionDays | quote }}
            - name: CR_RETENTION_KEEP_LAST
              value: {{ .Values.operator.crRetentionKeepLast | quote }}
            - name: CR_RETENTION_NAMESPACES
              value: {{ .Values.operator.crRetentionNamespaces | quote }}
            # Default Criteria workflow image recorded in CriteriaRuns.
            - name: DEFAULT_CRITERIA_IMAGE
              value: "{{ .Values.images.workflow.repository }}:{{ .Values.images.workflow.tag }}"
            # Source-mode base image (CRI-230/CRI-231): what url-only
            # spec.workflowSource runs execute on. url+image runs stamp
            # spec.image from the route, so this is the url-only default.
            - name: CRITERIA_BASE_IMAGE
              value: "{{ .Values.images.criteriaBase.repository }}:{{ .Values.images.criteriaBase.tag }}"
            # Adapter image fallback (CRI-214 M14): registry host and
            # default tag for adapter image references the operator composes
            # itself (ADAPTER_REGISTRY / ADAPTER_TAG).
            - name: ADAPTER_REGISTRY
              value: {{ .Values.images.adapter.registry | quote }}
            - name: ADAPTER_TAG
              value: {{ .Values.images.adapter.tag | quote }}
            - name: CRITERIA_DATA_PVC
              value: {{ .Values.pvc.data.name | quote }}
            - name: PROVIDER_BASE_URL
              value: {{ .Values.operator.providerBaseUrl | quote }}
            # Castle observation (CRI-135): run lifecycle is consumed from
            # the castle ServerService API instead of the PVC event file.
            # An empty address disables observation entirely. Reads are
            # anonymous against this stack's castle (dev mode runs with
            # --allow-anon-reads); the KB-314 run-archive lane additionally
            # needs the criteria token — castle rejects anonymous archive
            # writes, so with no token mounted the archive leg stays off
            # (the operator logs this loudly at startup) and observation
            # continues anonymously.
            - name: CASTLE_ADDR
              value: {{ .Values.operator.castleAddr | quote }}
            {{- if .Values.operator.castleTokenSpc }}
            # KB-314: the token file from the OpenBao CSI mount
            # (operator.castleTokenSpc). CRI-250 keeps credential material
            # out of env values — the chart delivers it as a mounted file.
            - name: CASTLE_TOKEN_FILE
              value: {{ printf "/var/run/secrets/criteria/castle/%s" .Values.openbao.castleTokenKey | quote }}
            {{- end }}
            # Node arch for child Job/pod templates (runner + per-scope
            # adapters): a cluster property, not per-workflow state. Set
            # operator.jobArch=arm64 on an arm64 cluster.
            - name: CRITERIA_JOB_ARCH
              value: {{ .Values.operator.jobArch | quote }}
            # KB-3: opt-in built-in linear-spc/copilot-spc secret volumes on
            # workflow-less (legacy) runs. Default false — a cluster without
            # the OpenBao Secrets Store CSI driver cannot mount them.
            - name: CRITERIA_LEGACY_SECRET_VOLUMES
              value: {{ .Values.operator.legacySecretVolumes | quote }}
            # KB-24: stall watchdog window — a Running run whose castle
            # stream shows no step progress for this long is failed so the
            # watcher can refire it (0s disables the watchdog).
            - name: CRITERIA_STALL_WINDOW
              value: {{ .Values.operator.stallWindow | quote }}
          {{- include "criteria-k8s.restrictedContainer" . | nindent 10 }}
          volumeMounts:
            - name: criteria-data
              mountPath: /data
              readOnly: true
            {{- if .Values.operator.castleTokenSpc }}
            - name: castle-token
              mountPath: /var/run/secrets/criteria/castle
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
      volumes:
        - name: criteria-data
          persistentVolumeClaim:
            claimName: {{ .Values.pvc.data.name }}
        {{- if .Values.operator.castleTokenSpc }}
        - name: castle-token
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.operator.castleTokenSpc | quote }}
        {{- end }}
{{- end }}