# SecretProviderClasses consumed by the runner Jobs (CSI mounts) and the
# Linear watcher. Objects resolve through the OpenBao CSI provider; the
# OpenBao kubernetes auth role and policy are external prerequisites and are
# never templated here.
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: linear-spc
  namespace: {{ include "criteria-k8s.namespace" . }}
  labels:
    {{- include "criteria-k8s.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.openbao.provider }}
  parameters:
    roleName: {{ .Values.openbao.roleName }}
    objects: |
      - objectName: linear_api_key
        secretPath: {{ .Values.openbao.secretPath }}
        secretKey: linear_api_key
        filePermission: 0444
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: copilot-spc
  namespace: {{ include "criteria-k8s.namespace" . }}
  labels:
    {{- include "criteria-k8s.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.openbao.provider }}
  parameters:
    roleName: {{ .Values.openbao.roleName }}
    objects: |
      - objectName: workflow_github_token
        secretPath: {{ .Values.openbao.secretPath }}
        secretKey: workflow_github_token
        filePermission: 0444
      - objectName: reviewer_github_token
        secretPath: {{ .Values.openbao.secretPath }}
        secretKey: reviewer_github_token
        filePermission: 0444