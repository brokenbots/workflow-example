# SecretProviderClasses consumed by the runner Jobs (CSI mounts). The
# criteria-linear-watcher consumed linear-spc too until its retirement
# (removed 2026-10-09, KB-228; Linear cutover complete); ticket polling now
# runs as the kanboard-watcher raw overlay with its own kanboard-spc.
# Objects resolve through the OpenBao CSI provider; the
# OpenBao kubernetes auth role and policy are external prerequisites and are
# never templated here.
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: linear-spc
  namespace: {{ include "criteria-k8s.namespace" . }}
  labels:
    {{- include "criteria-k8s.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.openbao.provider }}
  parameters:
    roleName: {{ .Values.openbao.roleName }}
    objects: |
      - objectName: linear_api_key
        secretPath: {{ .Values.openbao.secretPath }}
        secretKey: linear_api_key
        filePermission: 0444
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: copilot-spc
  namespace: {{ include "criteria-k8s.namespace" . }}
  labels:
    {{- include "criteria-k8s.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.openbao.provider }}
  parameters:
    roleName: {{ .Values.openbao.roleName }}
    objects: |
      - objectName: workflow_github_token
        secretPath: {{ .Values.openbao.secretPath }}
        secretKey: workflow_github_token
        filePermission: 0444
      - objectName: reviewer_github_token
        secretPath: {{ .Values.openbao.secretPath }}
        secretKey: reviewer_github_token
        filePermission: 0444
{{- if .Values.operator.castleTokenSpc }}
---
# KB-314: castle criteria token for the run-archive lane. Rendered only
# when operator.castleTokenSpc names it (opt-in, like the legacy secret
# volumes), so clusters without an OpenBao-token path behave as before. The
# operator pod reads the mounted token file via CASTLE_TOKEN_FILE.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.operator.castleTokenSpc | quote }}
  namespace: {{ include "criteria-k8s.namespace" . }}
  labels:
    {{- include "criteria-k8s.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.openbao.provider }}
  parameters:
    roleName: {{ .Values.openbao.roleName }}
    objects: |
      - objectName: {{ .Values.openbao.castleTokenKey }}
        secretPath: {{ .Values.openbao.secretPath }}
        secretKey: {{ .Values.openbao.castleTokenKey }}
        filePermission: 0444
{{- end }}