apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: criteriaruns.criteria.brokenbots.dev
spec:
  group: criteria.brokenbots.dev
  names:
    kind: CriteriaRun
    listKind: CriteriaRunList
    plural: criteriaruns
    singular: criteriarun
    shortNames:
      - cri
      - crun
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ticket
          type: string
          jsonPath: .spec.ticketId
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Job
          type: string
          jsonPath: .status.jobName
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - ticketId
                - repoUrl
              properties:
                ticketId:
                  type: string
                  description: Linear ticket identifier to process.
                  pattern: '^[A-Za-z0-9_-]+$'
                  maxLength: 64
                repoUrl:
                  type: string
                  description: GitHub repository to clone and work on.
                image:
                  type: string
                  description: Criteria workflow image to run.
                buildCmd:
                  type: string
                  description: Optional build command for the repository under test.
                testCmd:
                  type: string
                  description: Optional test command for the repository under test.
                ciGateCmd:
                  type: string
                  description: CI gate command for the implementation loop.
                baseBranch:
                  type: string
                  description: >-
                    Release-branch slice of the per-repo config (KB-154):
                    the branch the run forks from, validates against, and
                    opens its PR against. Empty means "main".
                maxAgentVisits:
                  type: integer
                  default: 2
                  description: Maximum visits for each agent gate.
                providerBaseUrl:
                  type: string
                  description: Ollama-compatible provider endpoint for adapters.
                perScopeSessions:
                  type: boolean
                  default: false
                  description: Opt into per-subworkflow adapter pods instead of run-duration adapter pods.
                workflow:
                  type: object
                  description: >-
                    Resolved workflow-library object stamped by the
                    kanboard-watcher (CRI-217: the retired linear-watcher
                    introduced the field) from the criteria-routes
                    ConfigMap. Consumed by the jobbuilder (CRI-222). Empty
                    means the operator defaults apply.
                  required:
                    - name
                    - type
                    - namespace
                  properties:
                    name:
                      type: string
                      description: Workflow-library name resolved for this run.
                    type:
                      type: string
                      enum:
                        - image
                        - url
                      description: Workflow source type (ADR-0005 D1).
                    namespace:
                      type: string
                      description: Namespace the workflow's runs are admitted into.
                    class:
                      type: string
                      enum:
                        - dev
                        - triage
                      description: Admission queue class (CRI-242). dev runs serialize per repoURL; triage runs are read-only against the repo and may run concurrently with any run on the same repoURL. Omitted defaults to dev.
                    image:
                      type: string
                      description: Container image (type=image, or the process image for url+image).
                    url:
                      type: string
                      description: Workflow source URL fetched at admission (type=url).
                    ref:
                      type: string
                      description: Operator-declared expected pin for fetched content (ADR-0005 D7).
                    volumes:
                      type: array
                      description: Storage volumes the workflow's runs mount.
                      items:
                        type: object
                        required:
                          - name
                          - kind
                          - mountPath
                        properties:
                          name:
                            type: string
                          kind:
                            type: string
                            enum:
                              - pvc
                              - nfs
                              - tmp
                              - k8s-secret
                          mountPath:
                            type: string
                          subPath:
                            type: string
                          readOnly:
                            type: boolean
                          claim:
                            type: string
                          server:
                            type: string
                          path:
                            type: string
                          sizeLimit:
                            type: string
                          secretName:
                            type: string
                          env:
                            type: object
                            additionalProperties:
                              type: string
                    secrets:
                      type: array
                      description: >-
                        Secrets the workflow's runs consume, referenced by
                        SecretProviderClass name (OpenBao via the Secrets
                        Store CSI driver). No credential material is carried.
                      items:
                        type: object
                        required:
                          - name
                          - secretProviderClass
                          - mountPath
                        properties:
                          name:
                            type: string
                          secretProviderClass:
                            type: string
                          mountPath:
                            type: string
                          env:
                            type: object
                            additionalProperties:
                              type: string
                    env:
                      type: object
                      description: Static environment variables set on every run of this workflow.
                      additionalProperties:
                        type: string
                    adapterImages:
                      type: object
                      description: >-
                        Per-adapter-kind image override (CRI-214 M14):
                        adapter kind to a full image reference the operator
                        stamps on this workflow's adapter pods, ahead of the
                        event's image_reference and the configured
                        registry/tag defaults.
                      additionalProperties:
                        type: string
                        pattern: '^\S+$'
                interface:
                  type: object
                  description: >-
                    The workflow tree's machine-readable interface
                    declaration (KB-310, ADR 307): what a run needs from a
                    project binding (adapter kinds, mount paths, secret env
                    lanes, env names) and the config slots the tree honors.
                    Stamped from the routes workflow object; the schema of
                    record is k8s/workflow-interface.schema.json. The
                    operator's admission validation fails a run closed when
                    its binding does not satisfy the contract
                    (InterfaceBindingMismatch). Nil for type=image runs
                    (pre-KB-310 legacy carve-out).
                  required:
                    - apiVersion
                    - kind
                    - workflow
                  properties:
                    apiVersion:
                      type: string
                      description: Declared apiVersion (criteria.brokenbots.dev/v1).
                    kind:
                      type: string
                      description: Declared kind (WorkflowInterface).
                    workflow:
                      type: string
                      description: Workflow tree name the declaration belongs to.
                    description:
                      type: string
                      description: The tree's one-line description of the contract.
                    adapters:
                      type: array
                      description: Required adapter kinds.
                      items:
                        type: string
                    mounts:
                      type: array
                      description: Required mount paths.
                      items:
                        type: object
                        required:
                          - name
                          - mountPath
                          - kind
                        properties:
                          name:
                            type: string
                          mountPath:
                            type: string
                          kind:
                            type: string
                            enum:
                              - pvc
                              - tmp
                    secretEnv:
                      type: array
                      description: Required secret env lanes (environment variable names).
                      items:
                        type: string
                    env:
                      type: array
                      description: Environment names the tree reads on the workflow binding itself.
                      items:
                        type: string
                    configSlots:
                      type: array
                      description: Config keys the tree honors.
                      items:
                        type: object
                        required:
                          - slot
                          - variable
                          - target
                        properties:
                          slot:
                            type: string
                            description: Config key name the binding may carry.
                          variable:
                            type: string
                            description: Tree variable the slot's value renders as.
                          target:
                            type: string
                            description: Step/agent within the tree that reads the variable.
                          description:
                            type: string
                workflowSource:
                  type: object
                  description: >-
                    Source mode (CRI-231, ADR-0005 D1): the run fetches and
                    applies the declared workflow source at run time instead
                    of the baked-tree image mode. Non-nil selects source
                    mode; empty keeps the baked-tree path. Provenance is
                    recorded by the criteria run-metadata publisher (CRI-225).
                  required:
                    - type
                    - url
                  properties:
                    type:
                      type: string
                      enum:
                        - url
                      description: Workflow source type (ADR-0005 D1), declared never inferred.
                    url:
                      type: string
                      description: Workflow source URL fetched and applied at run time.
                    ref:
                      type: string
                      description: Operator-declared expected pin for fetched content (CRI-226).
                configRef:
                  type: object
                  description: >-
                    Per-repo config ConfigMap pin (KB-103): the watcher
                    resolves the run's config from the routes configLibrary
                    and pins the ConfigMap name plus the resourceVersion
                    observed at stamping time. The operator renders the
                    run's build/test/ci-gate commands and baseBranch
                    (KB-154) from it (ConfigMap values outrank the spec fields) and re-verifies the pin
                    on every reconcile pass: a ConfigMap replaced under an
                    admitted run fails it with a ConfigRenderDrift
                    condition (the workflowSource ref-pin symmetry, CRI-226).
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      description: ConfigMap name (a configLibrary entry name in routes).
                    resourceVersion:
                      type: string
                      description: ResourceVersion observed at stamping time; a later mismatch fails closed.
                projectBindingRef:
                  type: object
                  description: >-
                    Project binding ConfigMap pin (KB-311, ADR 307): the
                    project's complete execution config (images, env,
                    volumes, secrets, config slots) owned in the run's
                    namespace under criteria-binding. The watcher stamps it
                    for projects marked cutover:done in the routes
                    projectRegistry; the operator admits through that
                    binding and re-verifies the pin, fail closed. Nil keeps
                    the pre-KB-311 behavior (the workflow entry's inline
                    config is the whole contract).
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      description: Binding ConfigMap name in the run's namespace (always "criteria-binding").
                    resourceVersion:
                      type: string
                      description: ResourceVersion observed at stamping time; a later mismatch fails closed.
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Running
                    - Succeeded
                    - Failed
                    - Unknown
                  description: Lifecycle phase of the child Job.
                jobName:
                  type: string
                  description: Name of the reconciled child Job.
                baseImage:
                  type: string
                  description: >-
                    Runner image the child Jobs were pinned with when this
                    run was admitted (CRI-264). A mismatch against the
                    operator's currently resolved runner image fails the run
                    fast with a BaseImageMismatch condition instead of
                    replaying a stale image through backoff.
                configRender:
                  type: object
                  description: >-
                    The config the run executes on (KB-103): the
                    admission-time render of the pinned config ConfigMap
                    (or the spec fields alone when it does not exist).
                    Rendered once and never re-derived — config
                    provenance, like status.baseImage; ConfigMap patches
                    never switch an in-flight run.
                  properties:
                    configMap:
                      type: string
                      description: Pinned ConfigMap name; empty when no configRef or it was absent at admission.
                    resourceVersion:
                      type: string
                      description: ConfigMap resourceVersion observed at render time.
                    buildCmd:
                      type: string
                      description: Rendered build command (ConfigMap value outranking the spec field).
                    testCmd:
                      type: string
                      description: Rendered test command.
                    ciGateCmd:
                      type: string
                      description: Rendered CI gate command.
                    baseBranch:
                      type: string
                      description: >-
                        Rendered branch the run forks from, validates
                        against, and opens its PR against (ConfigMap value
                        outranking the spec field; empty remains "main" at
                        consumption).
                launchManifest:
                  type: object
                  description: >-
                    Launch manifest stamped once at admission (KB-310): the
                    reproducibility contract of exactly what the run was
                    admitted with — workflow ref+digest, interface and
                    binding checksums, operator version, resolved secret
                    lanes.
                  required:
                    - bindingChecksum
                  properties:
                    workflowRef:
                      type: string
                      description: Resolved workflow source URL the run executes.
                    workflowDigest:
                      type: string
                      description: Operator-declared pin the source fetch was verified against.
                    interfaceChecksum:
                      type: string
                      description: Sha256 of the stamped interface's canonical JSON.
                    bindingChecksum:
                      type: string
                      description: Sha256 of spec.workflow's canonical JSON.
                    operatorVersion:
                      type: string
                      description: Operator binary version at admission (OPERATOR_VERSION when set).
                    lanes:
                      type: array
                      description: Resolved secret lanes, each "<ENV_NAME>@<secret entry name>", sorted.
                      items:
                        type: string
                ticketState:
                  type: string
                  description: >-
                    Final Linear ticket state (CRI-132 semantics). The castle
                    path leaves it unset: castle carries no Linear
                    ticket-state source (RunCompleted.final_state is the
                    engine's workflow terminal state, not the Linear state).
                    Not part of the terminal-completion gate.
                eventsPath:
                  type: string
                  description: Absolute path to the run's events file on /data.
                castleRunId:
                  type: string
                  description: Run id in the castle control plane backing this run.
                castleTerminalObserved:
                  type: boolean
                  description: >-
                    Set when a castle observation delivered the run's
                    terminal outcome (the run record's terminal status
                    and/or RunCompleted/RunFailed envelopes). Gates terminal
                    requeue completion.
                archiveId:
                  type: string
                  description: >-
                    Castle run-archive id ("run-archive/<key>") this run's
                    terminal record was stored under, stamped by the
                    terminal archive gate before reaping and finalizer
                    removal. Empty on a terminal run means not yet archived.
                archivePending:
                  type: boolean
                  description: >-
                    Set when the terminal archive gate has not landed the
                    run's castle archive record (TerminalArchivePending
                    condition carries the reason/message).
                finalState:
                  type: string
                  description: >-
                    The workflow's own verdict: the terminal state name the
                    workflow ended in (RunCompleted.final_state), stamped
                    from the castle terminal envelope. "failed" is the
                    failure verdict, "handler_complete" delivered the work,
                    and "need_assistance" handed the ticket to a human. Empty
                    when the terminal came from the castle run record or
                    castle observation is disabled.
                lastStepProgress:
                  type: string
                  format: date-time
                  description: >-
                    Timestamp of the newest step-progress event in the run's
                    castle event stream, stamped by the stall watchdog
                    (KB-24): lifecycle envelopes count, as do the copilot
                    adapter's agent-activity AdapterEvents (agent.message,
                    tool.invocation, tool.result, permission.request,
                    limit.reached, outcome.finalized); heartbeats,
                    terminal envelopes and non-activity adapter chatter do
                    not. Baseline of the stall watchdog: when the operator
                    observes no step progress for the stall window
                    (CRITERIA_STALL_WINDOW, default 30m) while the run is
                    still Running, the run is failed with a StallWatchdog
                    condition so CriteriaRun reflects Failed instead of
                    hanging in Running.
                terminalAt:
                  type: string
                  format: date-time
                  description: >-
                    Time the run went terminal (KB-309): stamped once, when
                    the phase first lands on a terminal value, preferring the
                    castle terminal envelope's own timestamp with the
                    reconcile clock as fallback. The terminal retention
                    sweep's aging clock: a terminal run is only eligible for
                    deletion once this is set and older than the retention
                    window; an unstamped terminal run is never a deletion
                    candidate.
                observedGeneration:
                  type: integer
                  format: int64
                  description: Last reconciled metadata generation.
                queue:
                  type: object
                  description: Repo-keyed admission queue state for this run.
                  properties:
                    repoUrl:
                      type: string
                      description: Repository the queue is keyed on.
                    class:
                      type: string
                      description: Admission queue class the queue is keyed on (CRI-242). dev serializes per repoURL; triage admits concurrently. Always populated; runs without an explicit class resolve to dev.
                    position:
                      type: integer
                      description: Pending queue position. Zero means the run is admitted and running.
                    length:
                      type: integer
                      description: Total number of runs queued for this repository.
                    running:
                      type: string
                      description: Name of the CriteriaRun currently admitted for this repository.
                    pending:
                      type: array
                      description: Names of queued CriteriaRuns for this repository, in FIFO order.
                      items:
                        type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
