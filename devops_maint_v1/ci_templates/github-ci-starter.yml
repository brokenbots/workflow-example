# devops_maint_v1 Lane B — language CI template: starter repos (KB-408,
# ADR-0015 wave 3).
#
# Applied per starter repo as .github/workflows/ci.yml (in the starter repo's
# own language variant, the KB-408 language templates land on top of these
# guarantees). Branch-protection mapping of the check contexts below is
# KB-409's contract — this template guarantees the stable job `name:` values
# that KB-409 records as required checks (changes, build-parity, smoke).
#
# Job set (ADR-0015 Lane B starter template):
#   build-parity  the starter contract on one commit:
#                   (1) exactly-one-language guard — the tree declares exactly
#                       one of go.mod / package.json / pyproject.toml (or
#                       setup.py); two languages or none is a red gate;
#                   (2) make build  — the makefile path;
#                   (3) the language's canonical build path — go build ./...,
#                       npm ci && npm run build, or python -m pip install -e .
#                       — both paths must be green for parity to hold.
#   smoke         make smoke exists and passes. A missing smoke target is an
#                 explicit, loud failure (the starter contract always carries
#                 make build + make smoke).
#
# KB-404 docs-only design (ADR-0015): the repo-state heavy jobs SKIP on a
# docs-only PR, always run on push-to-main, and always run on a mixed diff.
# The `changes` gate job classifies the PR's changed-file set (fail-safe: any
# detection failure or ambiguous path keeps the full run) and every heavy job
# gates on it (docs-only also cascades build-parity's skip into smoke through
# the needs edge). Required-check note for KB-409: on docs-only PRs the heavy
# jobs record a skipped conclusion, which GitHub branch protection treats as a
# satisfied check, so the contexts below stay listed without blocking
# docs-only PRs.
#
# Why a plain .yml and not a .sh.tftpl: GitHub Actions `${{ }}` expressions
# are Go text/template syntax; the devops_maint_v1 engine renders templates
# through templatefile(3) and would mangle them. Application (KB-409) writes
# these files byte-exact via file() and reads them back for verification.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        name: detect docs-only change (KB-404 design)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # ── KB-404 docs-only detection (every heavy job gates on it) ──
          set -euo pipefail

          # Fail-safe contract: the skip needs positive evidence that EVERY
          # changed file is documentation. Any detection failure or ambiguous
          # path keeps the full run and exits 0, so the gate itself never
          # red-blocks a PR for infra reasons and never skips without
          # evidence.
          docs_only=false
          reason="push or non-PR event: always full (${EVENT_NAME})"

          finish() {
            printf 'docs_only=%s\n' "${docs_only}" >>"${GITHUB_OUTPUT:?GITHUB_OUTPUT not set}"
            printf 'reason=%s\n' "${reason}" >>"${GITHUB_OUTPUT:?GITHUB_OUTPUT not set}"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              if [ "${docs_only}" = "true" ]; then
                verdict="heavy jobs SKIP (docs-only PR)"
              else
                verdict="heavy jobs RUN (full)"
              fi
              printf '%s\n' "docs-only gate: ${reason} -> ${verdict}" >>"${GITHUB_STEP_SUMMARY}"
            fi
            exit 0
          }

          if [ "${EVENT_NAME}" != "pull_request" ]; then
            finish
          fi

          # Changed-file set = diff from the merge-base of the base branch and
          # the PR head (robust to rebase and force-push; no API calls, no
          # pagination).
          base_commit=""
          if ! base_commit="$(git merge-base "origin/${PR_BASE_REF}" "${PR_HEAD_SHA}" 2>/dev/null)"; then
            reason="merge-base against origin/${PR_BASE_REF} failed: running full"
            finish
          fi

          changed=""
          if ! changed="$(git diff --name-only "${base_commit}" "${PR_HEAD_SHA}" 2>/dev/null)"; then
            reason="git diff failed: running full"
            finish
          fi

          if [ -z "${changed}" ]; then
            reason="no changed files resolved: running full"
            finish
          fi

          docs_only=true
          while IFS= read -r path; do
            case "${path}" in
            *.md | *.markdown | *.mdx | *.rst | LICENSE | LICENSE.* | CODEOWNERS)
              : ;;
            docs/*.png | docs/*.jpg | docs/*.jpeg | docs/*.svg | docs/*.gif | docs/*.webp | docs/*.drawio)
              : ;;
            *)
              # Anything else — including anything under .github/ (workflows,
              # dependabot.yml) and any code file regardless of directory —
              # keeps the full run.
              docs_only=false
              reason="full run: ${path} is not a docs path"
              break ;;
            esac
          done <<<"${changed}"

          if [ "${docs_only}" = "true" ]; then
            reason="every changed file is a fail-safe docs path: skipping heavy jobs"
          fi
          finish
          # ── end KB-404 docs-only detection ──

  build-parity:
    name: build-parity
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: exactly-one-language guard
        run: |
          langs=0
          if [ -f go.mod ]; then
            echo "declared language: go"
            langs=$((langs + 1))
          fi
          if [ -f package.json ]; then
            echo "declared language: ts"
            langs=$((langs + 1))
          fi
          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            echo "declared language: py"
            langs=$((langs + 1))
          fi
          if [ "${langs}" -ne 1 ]; then
            echo "starter contract violated: tree must declare exactly one language (found ${langs})" >&2
            exit 1
          fi
      - name: make build path
        run: make build
      - name: parity: language build path (go)
        if: ${{ hashFiles('go.mod') != '' }}
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: parity: language build path (go)
        if: ${{ hashFiles('go.mod') != '' }}
        run: go build ./...
      - name: parity: language build path (ts)
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: parity: language build path (ts)
        if: ${{ hashFiles('package.json') != '' }}
        run: npm ci && npm run build
      - name: parity: language build path (py)
        if: ${{ hashFiles('pyproject.toml') != '' || hashFiles('setup.py') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: parity: language build path (py)
        if: ${{ hashFiles('pyproject.toml') != '' || hashFiles('setup.py') != '' }}
        run: python -m pip install -e .

  smoke:
    name: smoke
    needs: [changes, build-parity]
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: smoke contract (make smoke present and green)
        run: |
          if ! make -n smoke >/dev/null 2>&1; then
            echo "starter contract violated: no 'smoke' target in the Makefile — make build + make smoke are the starter contract" >&2
            exit 1
          fi
          make smoke
