apiVersion: v1
kind: ServiceAccount
metadata:
  name: criteria-k8s-operator
  namespace: criteria-jobs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: criteria-k8s-operator
rules:
  # Manage CriteriaRun resources and their status.
  - apiGroups: ["criteria.brokenbots.dev"]
    resources: ["criteriaruns"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["criteria.brokenbots.dev"]
    resources: ["criteriaruns/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["criteria.brokenbots.dev"]
    resources: ["criteriaruns/finalizers"]
    verbs: ["update"]
  # Reconcile CriteriaRun into batch Jobs and read pod logs for outcomes.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # CRI-264: probe the operator Deployment's env for the live runner image
  # resolution.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Read the shared pod-adapter scripts ConfigMap.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: criteria-k8s-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: criteria-k8s-operator
subjects:
  - kind: ServiceAccount
    name: criteria-k8s-operator
    namespace: criteria-jobs
