apiVersion: apps/v1
kind: Deployment
metadata:
  name: criteria-k8s-operator
  namespace: criteria-jobs
  labels:
    app.kubernetes.io/name: criteria-k8s-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: criteria-k8s-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: criteria-k8s-operator
    spec:
      serviceAccountName: criteria-k8s-operator
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
        - key: catch
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: localhost:5000/criteria-k8s:dev
          imagePullPolicy: IfNotPresent
          command: ["/manager"]
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          env:
            # Castle observation (CRI-135): run lifecycle is consumed from
            # the castle ServerService API instead of the PVC event file.
            - name: CASTLE_ADDR
              value: http://castle:8080
            # KB-314 run-archive lane: castle rejects anonymous ArchiveRun
            # calls, so the token below must resolve for archiving to be
            # enabled (the secret is provisioned out of band as a boot
            # prerequisite — with the address set and no token, the pod
            # fails CreateContainerConfigError, keeping the gap loud).
            - name: CASTLE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: castle-criteria-token
                  key: token
          volumeMounts:
            - name: criteria-data
              mountPath: /data
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: criteria-data
          persistentVolumeClaim:
            claimName: criteria-data
