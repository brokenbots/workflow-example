apiVersion: apps/v1
kind: Deployment
metadata:
  name: criteria-k8s-operator
  namespace: criteria-jobs
  labels:
    app.kubernetes.io/name: criteria-k8s-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: criteria-k8s-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: criteria-k8s-operator
    spec:
      serviceAccountName: criteria-k8s-operator
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
        - key: catch
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: operator
          image: localhost:5000/criteria-k8s:dev
          imagePullPolicy: IfNotPresent
          command: ["/manager"]
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: criteria-linear-watcher
  namespace: criteria-jobs
  labels:
    app.kubernetes.io/name: criteria-linear-watcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: criteria-linear-watcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: criteria-linear-watcher
    spec:
      serviceAccountName: criteria-k8s-operator
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
        - key: catch
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: watcher
          image: localhost:5000/criteria-k8s:dev
          imagePullPolicy: IfNotPresent
          command: ["/linear-watcher"]
          env:
            - name: NAMESPACE
              value: "criteria-jobs"
            - name: LINEAR_PROJECT_NAME
              value: "Criteria K8s Workflow Runner"
            - name: LINEAR_TRIAGE_STATE
              value: "Triage"
            - name: POLL_INTERVAL
              value: "60s"
            - name: CRITERIA_IMAGE
              value: "localhost:5000/linear-intake-remote:dev"
            - name: PROVIDER_BASE_URL
              value: "http://192.168.17.116:11434/v1"
            - name: MAX_AGENT_VISITS
              value: "2"
          volumeMounts:
            - name: linear-secrets
              mountPath: /secrets
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: linear-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: linear-spc
