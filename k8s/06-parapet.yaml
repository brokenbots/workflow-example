apiVersion: apps/v1
kind: Deployment
metadata:
  name: parapet
  namespace: criteria-jobs
  labels:
    app.kubernetes.io/name: parapet
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: parapet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: parapet
        app.kubernetes.io/component: ui
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
        - key: catch
          operator: Exists
          effect: NoSchedule
      containers:
        - name: parapet
          image: localhost:5000/parapet:v3
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: caddy-data
          emptyDir: {}
        - name: caddy-config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: parapet
  namespace: criteria-jobs
  labels:
    app.kubernetes.io/name: parapet
spec:
  selector:
    app.kubernetes.io/name: parapet
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
# Traefik Ingress: parapet (static UI + Connect proxy) exposed on the
# LoadBalancer address under /criteria.v1.* passthrough and UI at the root.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: castle-parapet
  namespace: criteria-jobs
  annotations:
    # gRPC/Connect needs h2c-capable backend transport.
    traefik.ingress.kubernetes.io/service.serversscheme: h2c
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: parapet
                port:
                  number: 80