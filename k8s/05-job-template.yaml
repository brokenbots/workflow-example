apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: linear-intake
    ticket: ${TICKET_ID}
spec:
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: linear-intake
        ticket: ${TICKET_ID}
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
        - key: catch
          operator: Exists
          effect: NoSchedule
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: linear-intake
          image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: linear-intake-credentials
                optional: true
          env:
            - name: TICKET_ID
              value: "${TICKET_ID}"
            - name: REPO_URL
              value: "${REPO_URL}"
            - name: LINEAR_REVIEW_STATE
              value: "${LINEAR_REVIEW_STATE}"
            - name: LINEAR_TRIAGE_STATE
              value: "${LINEAR_TRIAGE_STATE}"
            - name: LINEAR_WORK_STATE
              value: "${LINEAR_WORK_STATE}"
            - name: LINEAR_DONE_STATE
              value: "${LINEAR_DONE_STATE}"
            - name: BASE_BRANCH
              value: "${BASE_BRANCH}"
            - name: BUILD_CMD
              value: "${BUILD_CMD}"
            - name: TEST_CMD
              value: "${TEST_CMD}"
            - name: CI_GATE_CMD
              value: "${CI_GATE_CMD}"
            - name: TEST_REFS
              value: "${TEST_REFS}"
            - name: MAIN_REF
              value: "${MAIN_REF}"
            - name: STABLE_REF
              value: "${STABLE_REF}"
            - name: DESIGN_INTENT_FILE
              value: "${DESIGN_INTENT_FILE}"
            - name: REPRO_WORKFLOW_DIR
              value: "${REPRO_WORKFLOW_DIR}"
            - name: ALLOW_DIRTY
              value: "${ALLOW_DIRTY}"
            - name: MAX_AGENT_VISITS
              value: "${MAX_AGENT_VISITS}"
            - name: PROVIDER_BASE_URL
              value: "${PROVIDER_BASE_URL}"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: repo
              mountPath: /repo
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "8Gi"
              cpu: "4000m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ${DATA_PVC}
        - name: repo
          persistentVolumeClaim:
            claimName: ${REPO_PVC}
