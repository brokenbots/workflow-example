# Example pod-adapter Job for CRI-105.
#
# This manifest is a fully rendered version of k8s/job-cri-27.yaml. Customize
# the namespace, image, ticket, repository, provider URL, and PVC names for
# your cluster before applying. See k8s/README.md for the complete setup
# and debugging guide.
#
# Apply with:
#   kubectl apply -f k8s/examples/ticket-job.yaml
#
# Required prerequisites: namespace, service account, OpenBao secrets, and
# Secrets Store CSI driver are already configured (see k8s/README.md).
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: linear-spc
  namespace: criteria-jobs
spec:
  provider: openbao
  parameters:
    roleName: criteria-jobs
    objects: |
      - objectName: linear_api_key
        secretPath: criteria/data/linear
        secretKey: linear_api_key
        filePermission: 0600
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: copilot-spc
  namespace: criteria-jobs
spec:
  provider: openbao
  parameters:
    roleName: criteria-jobs
    objects: |
      - objectName: workflow_github_token
        secretPath: criteria/data/linear
        secretKey: workflow_github_token
        filePermission: 0600
      - objectName: reviewer_github_token
        secretPath: criteria/data/linear
        secretKey: reviewer_github_token
        filePermission: 0600
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: shell-spc
  namespace: criteria-jobs
spec:
  provider: openbao
  parameters:
    roleName: criteria-jobs
    objects: |
      - objectName: workflow_github_token
        secretPath: criteria/data/linear
        secretKey: workflow_github_token
        filePermission: 0600
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pod-adapter-scripts
  namespace: criteria-jobs
data:
  runner.sh: |
    #!/bin/sh
    set -eu
    
    # Read the Linear API key from the CSI mount. The workflow-runner container is
    # intentionally not given any GitHub token mounts.
    LINEAR_API_KEY=""
    if [ -r /secrets/linear_api_key ]; then
        IFS= read -r LINEAR_API_KEY < /secrets/linear_api_key
    fi
    if [ -z "$LINEAR_API_KEY" ]; then
        echo "LINEAR_API_KEY is required via /secrets/linear_api_key" >&2
        exit 1
    fi
    
    if [ -z "${TICKET_ID:-}" ]; then
        echo "TICKET_ID is required" >&2
        exit 1
    fi
    if [ -z "${REPO_URL:-}" ]; then
        echo "REPO_URL is required" >&2
        exit 1
    fi
    
    case "$ALLOW_DIRTY" in
        true|false) ;;
        *) echo "ALLOW_DIRTY must be true or false" >&2; exit 2 ;;
    esac
    case "$MAX_AGENT_VISITS" in
        ''|*[!0-9]*) echo "MAX_AGENT_VISITS must be a positive integer" >&2; exit 2 ;;
        0) echo "MAX_AGENT_VISITS must be a positive integer" >&2; exit 2 ;;
    esac
    
    mkdir -p "$INTAKE_ROOT/$TICKET_ID" "$TRIAGE_ROOT"
    
    # Generate a per-run bearer token for the remote adapters and publish it to the
    # shared PVC so all three containers agree on the token.
    token=$(head -c 48 /dev/urandom | base64 | tr -cd 'a-zA-Z0-9' | head -c 32)
    printf '%s' "$token" > /data/.criteria-remote-token
    
    workflow_src=/workflows
    workflow_tmp=/tmp/workflows
    rm -rf "$workflow_tmp"
    cp -a "$workflow_src" "$workflow_tmp"
    
    # Substitute the placeholders in every subworkflow's remote environment block
    # so each shim and the adapter sidecars share the generated bearer token. The
    # legacy placeholder literal is assembled at runtime so the launcher template
    # renderer does not try to replace it while rendering the manifest.
    old_token_placeholder="_""_CRITERIA_REMOTE_TOKEN_""_"
    find "$workflow_tmp" -name 'adapters.chcl' -exec sh -c '
        tok="$1"
        old="$2"
        shift 2
        for f; do
            sed -i \
                -e "s|CRITERIA_REMOTE_TOKEN_PLACEHOLDER|$tok|g" \
                -e "s|$old|$tok|g" \
                "$f"
        done
    ' sh "$token" "$old_token_placeholder" {} +
    
    # Rewrite GitHub token secrets so each adapter reads its own token from its CSI
    # mount instead of receiving it from the workflow-runner over the secret
    # channel. This lets the runner mount only the Linear API key.
    find "$workflow_tmp" -name 'adapters.chcl' -exec sed -i \
        -e 's|var\.workflow_github_token|env:WORKFLOW_GITHUB_TOKEN|g' \
        -e 's|var\.reviewer_github_token|env:REVIEWER_GITHUB_TOKEN|g' {} +
    
    runtime_dir=$(mktemp -d)
    runtime_vars="$runtime_dir/vars.json"
    trap 'rm -rf "$runtime_dir"' EXIT
    
    jq -n \
        --arg ticket_id "$TICKET_ID" \
        --arg repo_dir "$REPO_DIR" \
        --arg intake_root "$INTAKE_ROOT" \
        --arg triage_root "$TRIAGE_ROOT" \
        --arg linear_review_state "$LINEAR_REVIEW_STATE" \
        --arg linear_triage_state "$LINEAR_TRIAGE_STATE" \
        --arg linear_work_state "$LINEAR_WORK_STATE" \
        --arg linear_done_state "$LINEAR_DONE_STATE" \
        --arg base_branch "$BASE_BRANCH" \
        --arg build_cmd "$BUILD_CMD" \
        --arg test_cmd "$TEST_CMD" \
        --arg ci_gate_cmd "$CI_GATE_CMD" \
        --arg test_refs "$TEST_REFS" \
        --arg main_ref "$MAIN_REF" \
        --arg stable_ref "$STABLE_REF" \
        --arg design_intent_file "$DESIGN_INTENT_FILE" \
        --arg repro_workflow_dir "$REPRO_WORKFLOW_DIR" \
        --arg provider_base_url "$PROVIDER_BASE_URL" \
        --argjson allow_dirty "$ALLOW_DIRTY" \
        --argjson max_agent_visits "$MAX_AGENT_VISITS" \
        '{
            ticket_id: $ticket_id,
            repo_dir: $repo_dir,
            intake_root: $intake_root,
            triage_root: $triage_root,
            linear_review_state: $linear_review_state,
            linear_triage_state: $linear_triage_state,
            linear_work_state: $linear_work_state,
            linear_done_state: $linear_done_state,
            base_branch: $base_branch,
            build_cmd: $build_cmd,
            test_cmd: $test_cmd,
            ci_gate_cmd: $ci_gate_cmd,
            test_refs: $test_refs,
            main_ref: $main_ref,
            stable_ref: $stable_ref,
            design_intent_file: $design_intent_file,
            repro_workflow_dir: $repro_workflow_dir,
            provider_base_url: $provider_base_url,
            allow_dirty: $allow_dirty,
            max_agent_visits: $max_agent_visits
        }' > "$runtime_vars"
    
    # shellcheck disable=SC2153
    : "${EVENTS_FILE:=}"
    events_file="$EVENTS_FILE"
    if [ -z "$events_file" ]; then
        events_file="$INTAKE_ROOT/$TICKET_ID/events.ndjson"
    fi
    
    # Dummy values for GitHub token variables: the real values live in each adapter
    # container's CSI mount and are resolved via env: references at runtime.
    /usr/local/bin/criteria apply "$workflow_tmp/linear_intake_v1" \
        --var-file "$runtime_vars" \
        --var "linear_api_key=$LINEAR_API_KEY" \
        --var "workflow_github_token=csi-supplied" \
        --var "reviewer_github_token=csi-supplied" \
        --events-file "$events_file" \
        --output concise
  sidecar.sh: |
    #!/bin/sh
    set -eu
    
    # Read this container's own CSI-mounted secrets. The copilot sidecar mounts
    # both tokens; the shell sidecar mounts only the workflow token.
    WORKFLOW_GITHUB_TOKEN=""
    if [ -r /secrets/workflow_github_token ]; then
        IFS= read -r WORKFLOW_GITHUB_TOKEN < /secrets/workflow_github_token
    fi
    if [ -z "$WORKFLOW_GITHUB_TOKEN" ]; then
        echo "WORKFLOW_GITHUB_TOKEN is required via /secrets/workflow_github_token" >&2
        exit 1
    fi
    
    REVIEWER_GITHUB_TOKEN=""
    if [ -r /secrets/reviewer_github_token ]; then
        IFS= read -r REVIEWER_GITHUB_TOKEN < /secrets/reviewer_github_token
    fi
    if [ -z "$REVIEWER_GITHUB_TOKEN" ] && [ "$ADAPTER_KIND" = "copilot" ]; then
        echo "REVIEWER_GITHUB_TOKEN is required via /secrets/reviewer_github_token" >&2
        exit 1
    fi
    
    # Wait for the workflow-runner to publish the shared remote token.
    until [ -r /data/.criteria-remote-token ]; do
        sleep 1
    done
    CRITERIA_REMOTE_TOKEN=$(cat /data/.criteria-remote-token)
    export CRITERIA_REMOTE_TOKEN
    
    if [ -z "${ADAPTER_KIND:-}" ]; then
        echo "ADAPTER_KIND must be set to shell or copilot" >&2
        exit 1
    fi
    
    export WORKFLOW_GITHUB_TOKEN
    if [ -n "$REVIEWER_GITHUB_TOKEN" ]; then
        export REVIEWER_GITHUB_TOKEN
    fi
    
    # Resolve the pinned adapter digest from the workflow lockfile. The same digest
    # is used as the adapter's identity over the remote handshake.
    lockfile=/workflows/linear_intake_v1/.criteria.lock.hcl
    digest=$(awk -v k="criteria-adapter-$ADAPTER_KIND" '
        $0 ~ "reference.*"k { in_entry=1 }
        in_entry && /resolved_digest/ { gsub(/[\" ]/, ""); sub(/^resolved_digest=sha256:/, ""); print; exit }
    ' "$lockfile")
    if [ -z "$digest" ]; then
        echo "criteria adapter $ADAPTER_KIND not found in $lockfile" >&2
        exit 1
    fi
    
    binary="/home/criteria/.local/criteria/adapters/sha256-${digest}/criteria-adapter-${ADAPTER_KIND}"
    if [ ! -x "$binary" ]; then
        echo "adapter binary not found: $binary" >&2
        exit 1
    fi
    
    # Shell steps run git/gh commands; set a generic bot identity and the gh
    # credential helper so the adapter's own token is used for HTTPS clones.
    if [ "$ADAPTER_KIND" = "shell" ]; then
        git config --global credential.https://github.com.helper '!gh auth git-credential'
        git config --global user.name "criteria-runner"
        git config --global user.email "criteria-runner@brokenbots.invalid"
    fi
    
    export CRITERIA_REMOTE_HOST=127.0.0.1:7778
    export CRITERIA_REMOTE_DIGEST="sha256:$digest"
    
    exec "$binary"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pod-adapter-cri-105
  namespace: criteria-jobs
  labels:
    app.kubernetes.io/name: pod-adapter-run
    ticket: CRI-105
spec:
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pod-adapter-run
        ticket: CRI-105
    spec:
      serviceAccountName: criteria-runner
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        - name: repo-clone
          image: localhost:5000/linear-intake-remote:dev
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              WORKFLOW_GITHUB_TOKEN=""
              if [ -r /secrets/workflow_github_token ]; then
                  IFS= read -r WORKFLOW_GITHUB_TOKEN < /secrets/workflow_github_token
              fi
              if [ -z "$WORKFLOW_GITHUB_TOKEN" ]; then
                  echo "WORKFLOW_GITHUB_TOKEN is required via /secrets/workflow_github_token" >&2
                  exit 1
              fi
              if [ -z "$REPO_URL" ]; then
                  echo "REPO_URL is required" >&2
                  exit 1
              fi
              find /repo -mindepth 1 -delete 2>/dev/null || true
              git config --global credential.https://github.com.helper '!gh auth git-credential'
              GH_TOKEN="$WORKFLOW_GITHUB_TOKEN" gh repo clone "$REPO_URL" /repo
          env:
            - name: REPO_URL
              value: "brokenbots/workflow-example"
          volumeMounts:
            - name: repo
              mountPath: /repo
            - name: shell-secrets
              mountPath: /secrets/workflow_github_token
              subPath: workflow_github_token
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      containers:
        - name: workflow-runner
          image: localhost:5000/linear-intake-remote:dev
          imagePullPolicy: IfNotPresent
          command:
            - /opt/criteria-pod-adapter/runner.sh
          env:
            - name: TICKET_ID
              value: "CRI-105"
            - name: REPO_URL
              value: "brokenbots/workflow-example"
            - name: REPO_DIR
              value: "/repo"
            - name: INTAKE_ROOT
              value: "/data/intake"
            - name: TRIAGE_ROOT
              value: "/data/triage"
            - name: LINEAR_REVIEW_STATE
              value: "In Review"
            - name: LINEAR_TRIAGE_STATE
              value: "Triage"
            - name: LINEAR_WORK_STATE
              value: "In Progress"
            - name: LINEAR_DONE_STATE
              value: "Done"
            - name: BASE_BRANCH
              value: "main"
            - name: BUILD_CMD
              value: ""
            - name: TEST_CMD
              value: ""
            - name: CI_GATE_CMD
              value: "make test"
            - name: TEST_REFS
              value: "both"
            - name: MAIN_REF
              value: "origin/main"
            - name: STABLE_REF
              value: ""
            - name: DESIGN_INTENT_FILE
              value: ""
            - name: REPRO_WORKFLOW_DIR
              value: ""
            - name: ALLOW_DIRTY
              value: "false"
            - name: MAX_AGENT_VISITS
              value: "2"
            - name: PROVIDER_BASE_URL
              value: "http://192.168.17.116:11434/v1"
            - name: EVENTS_FILE
              value: ""
          volumeMounts:
            - name: data
              mountPath: /data
            - name: repo
              mountPath: /repo
            - name: linear-secrets
              mountPath: /secrets/linear_api_key
              subPath: linear_api_key
            - name: scripts
              mountPath: /opt/criteria-pod-adapter
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "8Gi"
              cpu: "4000m"
        - name: adapter-copilot
          image: localhost:5000/linear-intake-remote:dev
          imagePullPolicy: IfNotPresent
          command:
            - /opt/criteria-pod-adapter/sidecar.sh
          env:
            - name: ADAPTER_KIND
              value: copilot
          volumeMounts:
            - name: data
              mountPath: /data
            - name: repo
              mountPath: /repo
            - name: copilot-secrets
              mountPath: /secrets/workflow_github_token
              subPath: workflow_github_token
            - name: copilot-secrets
              mountPath: /secrets/reviewer_github_token
              subPath: reviewer_github_token
            - name: scripts
              mountPath: /opt/criteria-pod-adapter
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
        - name: adapter-shell
          image: localhost:5000/linear-intake-remote:dev
          imagePullPolicy: IfNotPresent
          command:
            - /opt/criteria-pod-adapter/sidecar.sh
          env:
            - name: ADAPTER_KIND
              value: shell
          volumeMounts:
            - name: data
              mountPath: /data
            - name: repo
              mountPath: /repo
            - name: shell-secrets
              mountPath: /secrets/workflow_github_token
              subPath: workflow_github_token
            - name: scripts
              mountPath: /opt/criteria-pod-adapter
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: criteria-data
        - name: repo
          emptyDir: {}
        - name: linear-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: linear-spc
        - name: copilot-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: copilot-spc
        - name: shell-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: shell-spc
        - name: scripts
          configMap:
            name: pod-adapter-scripts
            defaultMode: 0755
