# Routes ConfigMap — the operator configuration of record for Criteria
# workflow routing (CRI-216). Introduced by ADR-0005's D1/D2 workflow source
# model; consumed by operator routing from CRI-223 onward.
#
# The single data key 'routes.json' holds the payload. Its schema of record is
# k8s/routes.schema.json; k8s/tests/test_routes_config.sh validates this
# example against that schema. The payload is JSON (a valid YAML scalar inside
# the ConfigMap) so it can be validated without a YAML parser.
#
# ADR-0005 mode mapping (declared, never inferred):
#   type=image            -> image-only: workflow baked into the image.
#   type=url (no image)   -> url-only: fetched at admission, minimal runtime.
#   type=url + image      -> url+image: URL is content, image is process.
#
# KB-281 (2026-10-17): the linear_intake_v1 / linear_triage_v1 /
# linear_develop_v1 trees and their url objects ('linear-intake-url',
# 'linear-develop-url', 'linear-triage-url') plus the 'criteria-triage' /
# 'criteria-develop' routes are RETIRED — removed from this example. The
# 'linear-intake-v1' image object stays: it pins the frozen
# localhost:5000/linear-intake-remote:dev registry image (nothing in this
# repo builds that image anymore) and keeps the legacy intake behavior
# reachable via a ticket's workflows-label-group override — no route
# assigns it by default anymore.
#
# KB-103: 'configLibrary' holds per-repo runner config (build/test/ci-gate
# commands). Each entry name doubles as the ConfigMap name the operator
# renders at admission; routes bind to an entry with an optional 'configRef'
# (the retired 'criteria-develop' route carried it so its dev runs gated
# BEFORE PR open — no live route binds the 'workflow-example' entry today;
# the entry stays as the repo's documented runner config).
# A repo's own ConfigMap (named after its configLibrary entry, in the
# execution namespace) can declare the same camelCase data keys; patching it
# is a routing change for future refires only — admitted runs stamped the
# pin fail-closed (ConfigRenderDrift).
#
# CRI-243 (plan CRI-214 M10.1, exit condition 3): the criteria project's
# routes followed the split pattern — the 'criteria-triage' route fired
# linear_triage_v1 on [Triage] and the 'criteria-develop' route fired
# linear_develop_v1 on [Ready for Development], url-only with ADR-0005 D7
# commit pins ('triage' class on triage runs: read-only against the repo,
# so triage runs admitted concurrently with any run on the same repoURL
# while dev runs serialized per repoURL). KB-281 retired that estate with
# the linear_* trees: those routes and objects are gone. CRI-242's class
# semantics live on in the kanboard and cleanup routes.
# CRI-310 (plan CRI-214 M10.4, carrier for CRI-246, validation run C): the
# dirty label is a ROUTING SURFACE. The 'ticket-cleanup-url' object fetches
# the ticket_cleanup_v1 tree (url-only, no image, on criteria-base — the
# CRI-244 validation-run-a child shape: single shell adapter, no git
# operations, so its only secret is the Linear API key) and the
# 'criteria-cleanup' route fires it on tickets carrying the watcher's sticky
# "criteria-dirty" label in [Ready for Development]. (KB-281: the tag-less
# general develop route this route used to out-prioritize is retired, so
# for tickets without the dirty label nothing matches — the watcher fails
# closed; the tag-based route needs no priority tie-break anymore. The
# internal/routes/routes.go specific-over-general resolution still governs
# the remaining multi-candidate shapes.) Its class is 'triage'
# (CRI-242): the cleanup pass is read-only against the repo.
# The object ships WITHOUT a 'ref' pin deliberately: this repository squash
# merges (the shipped pins all name main-landed commits — set in FOLLOW-UP
# changes CRI-241/CRI-243 once the squashed merge commit existed and was
# unguessable before). A
# follow-up change must pin 'ref' to the merge commit that lands
# ticket_cleanup_v1, per the same "any change to a subtree must re-pin its
# object's 'ref'" rule below; until then the fetch resolves the tree at the
# default branch head exactly like every other pinless url-only object.
# Any change to either subtree must re-pin its object's 'ref' to the new
# resolved commit SHA — ADR-0005 D7 enforces the pin fail-closed at
# admission.
#
# KB-11 smoke (castle v11 e2e validation) proved the re-pin rule on the
# kanboard dual-source objects: both kanboard-*-url objects still pinned
# 308315c (the #94 classification-readfile re-pin) after the develop tree's
# getTaskTags fix (#106) landed, so the kanboard-develop route kept
# fetching the PRE-#106 tree whose fetch_ticket passed project_id
# alongside task_id — real Kanboard rejects it with -32602 "Too many
# arguments" and the raw error body was stored as ticket.json's tags. The
# merged fix never executed until both objects were re-pinned to main
# (b5ee6e69f45d821ac03901dc89c687f8942234ad, the current tree carrying the
# #106 fix). The subtree pins live and die with the rule below: any change
# to kanboard_triage_v1, kanboard_develop_v1, or the workstream_handler_v1
# sibling they lock must re-pin both objects in the same change, and
# k8s/tests/test_routes_config.sh pins the expected SHAs.
# The 'Ready for Development' state must exist on the CRI team
# before any triage run reaches that terminal:
# k8s/create-ready-for-development-state.sh creates it idempotently via the
# Linear API (type=unstarted — the work is refined but not begun), and the
# Makefile 'apply-routes' target documents the deploy ordering that pairs
# the operator/watcher rollout with the state creation and this cutover.
#
# KB-205 (ADR-0013 M6 consumer enablement): the demo workflows land in
# this repository as runnable proof of the decision adapter's composition
# shape (classification -> switch/match routing -> confidence-gated human
# approval). The 'decision-demo-url' object is ROUTE PREP ONLY for KB-207:
# no routes[] entry fires it yet (decision-demo-url stays route-less at prep
# time and KB-207 adds its route as part of that wiring), it is url-only and
# pinless, and KB-207 completes the wiring in one place —
# re-pinning 'ref' to the merge commit that lands decision_demo_v1 (the
# CRI-241/CRI-243 follow-up convention), declaring the decision adapter
# image in adapterImages, binding the System One credential surfaced by a
# SecretProviderClass (name references only), and adding the route entry.
#
# Secrets are name references only: every secret here points at a
# SecretProviderClass (OpenBao via the Secrets Store CSI driver). No
# credential material appears in this file (plan CRI-214 section 3.8).
#
# KB-214 (peer-pod flip, ADR-0007/0008): workflow adapterImages now pin the
# criteria-adapter-<kind>-peer images (built from the criteria repo's
# Dockerfile.peer; one container per pod runs 'criteria peer' directly —
# no adapter.sh, no remote-runner shim). The tags below are the FIRST peer
# builds of the 0.5.4/0.5.15 waves, so they are fresh refs; any corrected
# peer rebuild must push a NEW tag (e.g. 'k8s-0.5.4-2') — KB-63: same-tag
# re-push serves a stale cached manifest. Legacy
# criteria-adapter-<kind>:<tag> pins stay valid only for pre-CRI-233
# (env-less) workflows, which provision one pod per adapter via
# adapter.sh + criteria-adapter-remote-runner.
#
# KB-270 (2026-10-16): the 'castle' configLibrary entry + the per-repo
# 'castle' ConfigMap went LIVE in criteria-jobs (brokenbots/castle: criteria
# control-plane server + Parapet web UI). Castle needs CGO for go test -race,
# so the chain prefixes the PVC toolchain PATH and exports CGO_ENABLED=1;
# the entry below mirrors that live config.
# KB-273: the run-side gate is SPLIT so the parapet npm suite never runs on
# the ambient session image's node (the shell peer's Node 24 produced the
# run f5c205c2 cross-realm AbortSignal failure wall; the same suite is green
# only under Node 20 — the version castle's own GitHub CI pins). The gate
# keeps the Go/proto legs and points the parapet leg at the Node 20 runtime
# pinned onto the PVC toolchain (/data/tools/node20): npm ci + test:run under
# that PATH prefix. The vite production build (build-parapet) stays
# GitHub-CI-only, and proto-check-drift runs AFTER the parapet npm ci
# because its generated-bindings plugins come from parapet/node_modules/.bin.
# Tree mirrors live: the live 'castle' CM / routes configLibrary must carry
# the same split ciGateCmd (a kubectl patch on card-270 precedent) or
# admitted runs pin the stale Node-24-fatal chain (ConfigRenderDrift).
#
# KB-277 (2026-10-17, series ARMED on dave's parallel directive): the
# 'harness-contracts-url' object + 'harness-contracts' route ship the KB-254
# harness series' contracts leg (harness_contracts_v1, matrix C13-C18 +
# D19/D21/D22 — typed outcomes/contract fixtures + light-agent behavior).
# The object is url-ONLY for now and carries no 'ref': shipping pinless is
# the ADR-0005 D7 follow-up convention (decision-demo-url precedent) — at
# the card's close a follow-up re-pins 'ref'/?ref= to the squash-merge
# commit that lands the tree, because the subtree can't pin its own landing
# commit. The route fires ON DAVE'S GO within the green-run plan only:
# tag-gated (tagMatch=all on harness-validation + harness-contracts) over
# the criteria project's Ready for Development state, so a plain
# development card never matches it (criteria-cleanup selects the same
# state but the different criteria-dirty tag; the kanboard routes select
# the kanboard project). Secrets stay name references (CRI-214 plan
# section 3.8), and adapterImages pin the recorded fleet pin set verbatim
# (three-way pin agreement).
#
# KB-278 (2026-10-17, series ARMED on dave's parallel directive): the
# 'harness-composition-url' object + 'harness-composition' route ship the
# KB-254 harness series' composition leg (harness_composition_v1, matrix
# G1-G12 — embedded callee env grouping, iteration-body env pods, parallel
# concurrency guard, ADR-0009 substitution, SessionManager alias ledger,
# plus the composition KNOWN-GAP pins). Same url-ONLY/pinless-at-close
# convention as the contracts leg, same tag-gated Ready-for-Development
# gating (tagMatch=all on harness-validation + harness-composition) over
# the criteria project, same name-referenced secrets and verbatim fleet
# adapterImages pins.
#
# KB-279 (2026-10-18, series leg armed on dave's go within the green-run
# plan): the 'harness-failures-url' object + 'harness-failures' route ship
# the KB-254 harness series' failures leg (harness_failures_v1, matrix
# E24-E32 + G12 — engineered failure-path fixtures: provider stall class,
# bounded-retry park, unscheduled-capacity vs handshake-budget
# discrimination, heartbeat reaper parking, restart resume-vs-replay, stale
# pin refusal, BaseImageMismatch refusal, image-mirror identification, and
# the G12 silent env-change closeout). Same url-ONLY/pinless-at-close
# convention as the composition leg, same tag-gated Ready-for-Development
# gating (tagMatch=all on harness-validation + harness-failures) over
# the criteria project, same name-referenced secrets and verbatim fleet
# adapterImages pins.
#
# KB-280 (2026-10-18, dave go): the 'harness-fleet-smoke-url' object +
# 'harness-fleet-smoke' route ship the series' fast-feedback canary
# (harness_fleet_smoke_v1 — the ~90s deterministic pre-leg gate: identity
# handshake, one contract-mode-equivalent pinned green step, one engineered
# failure-class marker, boot-manifest shape assert; matrix slice
# A1/A2+F33-F37, no-agent). Same url-ONLY/pinless-at-close convention as the
# other harness legs, same tag-gated Ready-for-Development gating
# (tagMatch=all on harness-validation + harness-fleet-smoke) over the
# criteria project, same name-referenced secrets (github-tokens exists for
# the private-repo URL fetch, not the canary's own use — the tree declares
# no copilot member and no secret channel of its own), and a shell-only
# adapterImages pin (the fleet-smoke fleet is shell identity only).
# KB-276 (2026-10-17, series ARMED on dave's parallel directive): the
# 'harness-wire-url' object + 'harness-wire' route ship the KB-254 harness
# series' wire/transport leg (harness_wire_v1, matrix A1-A6 + B7-B12). The
# object is url-ONLY for now and carries no 'ref': shipping pinless is the
# ADR-0005 D7 follow-up convention (decision-demo-url precedent) — at the
# card's close a follow-up re-pins 'ref'/?ref= to the squash-merge commit
# that lands the tree, because the subtree can't pin its own landing commit.
# The route fires ON DAVE'S GO within the green-run plan only: tag-gated
# (tagMatch=all on harness-validation + harness-wire) over the criteria
# project's Ready for Development state, so a plain development card never
# matches it (criteria-cleanup selects the same state but the different
# criteria-dirty tag; the kanboard routes select the kanboard project).
# Secrets stay name references (CRI-214 plan section 3.8), and adapterImages
# pin the recorded fleet pin set verbatim (three-way pin agreement).
apiVersion: v1
kind: ConfigMap
metadata:
  name: criteria-routes
  namespace: criteria-jobs
  labels:
    app.kubernetes.io/name: criteria-routes
    app.kubernetes.io/managed-by: criteria-k8s
data:
  routes.json: |
