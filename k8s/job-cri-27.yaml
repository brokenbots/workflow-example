apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: linear-spc
  namespace: __NAMESPACE__
spec:
  provider: openbao
  parameters:
    roleName: criteria-jobs
    objects: |
      - objectName: linear_api_key
        secretPath: criteria/data/linear
        secretKey: linear_api_key
        filePermission: 0444
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: copilot-spc
  namespace: __NAMESPACE__
spec:
  provider: openbao
  parameters:
    roleName: criteria-jobs
    objects: |
      - objectName: workflow_github_token
        secretPath: criteria/data/linear
        secretKey: workflow_github_token
        filePermission: 0444
      - objectName: reviewer_github_token
        secretPath: criteria/data/linear
        secretKey: reviewer_github_token
        filePermission: 0444
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pod-adapter-scripts
  namespace: __NAMESPACE__
data:
  runner.sh: |
    #!/bin/sh
    set -eu
    
    # Read the Linear API key from the CSI mount. The workflow-runner container is
    # intentionally not given any GitHub token mounts.
    LINEAR_API_KEY=""
    if [ -r /secrets/linear_api_key ]; then
        LINEAR_API_KEY=$(cat /secrets/linear_api_key)
    fi
    if [ -z "$LINEAR_API_KEY" ]; then
        echo "LINEAR_API_KEY is required via /secrets/linear_api_key" >&2
        exit 1
    fi
    
    if [ -z "${TICKET_ID:-}" ]; then
        echo "TICKET_ID is required" >&2
        exit 1
    fi
    if [ -z "${REPO_URL:-}" ]; then
        echo "REPO_URL is required" >&2
        exit 1
    fi
    if [ -z "${JOB_NAME:-}" ]; then
        echo "JOB_NAME is required" >&2
        exit 1
    fi
    if [ -z "${POD_IP:-}" ]; then
        echo "POD_IP is required" >&2
        exit 1
    fi
    
    case "$ALLOW_DIRTY" in
        true|false) ;;
        *) echo "ALLOW_DIRTY must be true or false" >&2; exit 2 ;;
    esac
    case "$MAX_AGENT_VISITS" in
        ''|*[!0-9]*) echo "MAX_AGENT_VISITS must be a positive integer" >&2; exit 2 ;;
        0) echo "MAX_AGENT_VISITS must be a positive integer" >&2; exit 2 ;;
    esac
    
    mkdir -p "$INTAKE_ROOT/$TICKET_ID" "$TRIAGE_ROOT"
    
    # Git refuses repositories whose on-disk owner differs from the current user
    # (the emptyDir/PV clone runs under a different effective ownership view).
    git config --global --add safe.directory "$REPO_DIR"
    git config --global --add safe.directory "$REPO_DIR/**"
    
    # Per-run discovery directory. Adapters poll this path by convention to learn
    # the runner's dial address, the per-run bearer token, and the pinned adapter
    # digests. The directory is removed on exit so a subsequent run cannot reuse
    # the token.
    run_dir="/data/.criteria/runs/$JOB_NAME"
    mkdir -p "$run_dir"
    
    # Generate a per-run bearer token and publish it for the adapters.
    token=$(head -c 48 /dev/urandom | base64 | tr -cd 'a-zA-Z0-9' | head -c 32)
    printf '%s' "$token" > "$run_dir/token"
    
    # Resolve the pinned adapter digests from the workflow lockfile using the same
    # awk the local container entrypoint uses.
    lockfile=/workflows/linear_intake_v1/.criteria.lock.hcl
    adapter_digest() {
        kind="$1"
        digest=$(awk -v k="criteria-adapter-${kind}" '
            $0 ~ "reference.*"k { in_entry=1 }
            in_entry && /resolved_digest/ { gsub(/[" ]/, ""); sub(/^resolved_digest=sha256:/, ""); print; exit }
        ' "$lockfile")
        if [ -z "$digest" ]; then
            echo "criteria adapter $kind not found in $lockfile" >&2
            exit 1
        fi
        printf '%s' "$digest"
    }
    printf '%s' "$(adapter_digest shell)" > "$run_dir/digest-shell"
    printf '%s' "$(adapter_digest copilot)" > "$run_dir/digest-copilot"
    
    # Publish the runner dial address. The Kubernetes runtime widens the shim to
    # 0.0.0.0:7778 so separate adapter pods can reach it; local Docker runs keep
    # 127.0.0.1:7778 unchanged.
    printf '%s' "${POD_IP}:7778" > "$run_dir/host"
    
    workflow_src=/workflows
    workflow_tmp=/tmp/workflows
    rm -rf "$workflow_tmp"
    cp -a "$workflow_src" "$workflow_tmp"
    
    # Substitute the placeholders in every subworkflow's remote environment block
    # so each shim and the adapter pods share the generated bearer token. The
    # legacy placeholder literal is assembled at runtime so the launcher template
    # renderer does not try to replace it while rendering the manifest.
    old_token_placeholder="_""_CRITERIA_REMOTE_TOKEN_""_"
    find "$workflow_tmp" -name 'adapters.chcl' -exec sh -c '
        tok="$1"
        old="$2"
        shift 2
        for f; do
            sed -i \
                -e "s|CRITERIA_REMOTE_TOKEN_PLACEHOLDER|$tok|g" \
                -e "s|$old|$tok|g" \
                "$f"
        done
    ' sh "$token" "$old_token_placeholder" {} +
    
    # The declarative workflow keeps 127.0.0.1:7778 as its portable default. Only
    # the Kubernetes runtime widens the listen address so separate adapter pods can
    # phone home. accept_token stays enabled because the engine requires it for
    # non-loopback listen addresses.
    find "$workflow_tmp" -name 'adapters.chcl' -exec sed -i \
        -e 's|listen_address = "127\.0\.0\.1:7778"|listen_address = "0.0.0.0:7778"|g' {} +
    
    # The workflow HCL keeps its var.workflow_github_token / var.reviewer_github_token
    # secret references untouched: the compiler requires direct var.<name> bindings.
    # Instead the runner passes file: OriginRefs for those variables (--var below);
    # the engine's resolveSecretVarOrigins reads them through the secrets provider
    # stack (FileProvider) at run start and delivers the values to adapters over
    # OpenSession - the SDK contract (D69: adapters never read their own process
    # environment for workflow secrets). Tokens never appear as env vars or argv.
    
    runtime_dir=$(mktemp -d)
    runtime_vars="$runtime_dir/vars.json"
    cleanup() {
        rm -rf "$run_dir" "$runtime_dir"
    }
    trap cleanup EXIT
    
    jq -n \
        --arg ticket_id "$TICKET_ID" \
        --arg repo_dir "$REPO_DIR" \
        --arg intake_root "$INTAKE_ROOT" \
        --arg triage_root "$TRIAGE_ROOT" \
        --arg linear_review_state "$LINEAR_REVIEW_STATE" \
        --arg linear_triage_state "$LINEAR_TRIAGE_STATE" \
        --arg linear_work_state "$LINEAR_WORK_STATE" \
        --arg linear_done_state "$LINEAR_DONE_STATE" \
        --arg base_branch "$BASE_BRANCH" \
        --arg build_cmd "$BUILD_CMD" \
        --arg test_cmd "$TEST_CMD" \
        --arg ci_gate_cmd "$CI_GATE_CMD" \
        --arg test_refs "$TEST_REFS" \
        --arg main_ref "$MAIN_REF" \
        --arg stable_ref "$STABLE_REF" \
        --arg design_intent_file "$DESIGN_INTENT_FILE" \
        --arg repro_workflow_dir "$REPRO_WORKFLOW_DIR" \
        --arg provider_base_url "$PROVIDER_BASE_URL" \
        --argjson allow_dirty "$ALLOW_DIRTY" \
        --argjson max_agent_visits "$MAX_AGENT_VISITS" \
        '{
            ticket_id: $ticket_id,
            repo_dir: $repo_dir,
            intake_root: $intake_root,
            triage_root: $triage_root,
            linear_review_state: $linear_review_state,
            linear_triage_state: $linear_triage_state,
            linear_work_state: $linear_work_state,
            linear_done_state: $linear_done_state,
            base_branch: $base_branch,
            build_cmd: $build_cmd,
            test_cmd: $test_cmd,
            ci_gate_cmd: $ci_gate_cmd,
            test_refs: $test_refs,
            main_ref: $main_ref,
            stable_ref: $stable_ref,
            design_intent_file: $design_intent_file,
            repro_workflow_dir: $repro_workflow_dir,
            provider_base_url: $provider_base_url,
            allow_dirty: $allow_dirty,
            max_agent_visits: $max_agent_visits
        }' > "$runtime_vars"
    
    # shellcheck disable=SC2153
    : "${EVENTS_FILE:=}"
    events_file="$EVENTS_FILE"
    if [ -z "$events_file" ]; then
        events_file="$INTAKE_ROOT/$TICKET_ID/events.ndjson"
    fi
    
    # Secret variables are passed as file: OriginRefs: the engine resolves them
    # through the FileProvider at run start (resolveSecretVarOrigins). Raw token
    # values never appear in argv - only the mount paths.
    /usr/local/bin/criteria apply "$workflow_tmp/linear_intake_v1" \
        --var-file "$runtime_vars" \
        --var "linear_api_key=$LINEAR_API_KEY" \
        --var "workflow_github_token=file:/home/criteria/secrets/workflow_github_token" \
        --var "reviewer_github_token=file:/home/criteria/secrets/reviewer_github_token" \
        --events-file "$events_file" \
        --output concise
  adapter.sh: |
    #!/bin/sh
    set -eu
    
    if [ -z "${ADAPTER_KIND:-}" ]; then
        echo "ADAPTER_KIND must be set to shell or copilot" >&2
        exit 1
    fi
    if [ -z "${CRITERIA_RUN_JOB_NAME:-}" ]; then
        echo "CRITERIA_RUN_JOB_NAME must be set" >&2
        exit 1
    fi
    
    run_dir="/data/.criteria/runs/$CRITERIA_RUN_JOB_NAME"
    
    # Poll the per-run discovery directory written by the runner. Adapters mount
    # /data RW to the same shared PVC, so the runner can publish the dial
    # address, bearer token, and pinned digest without any CSI volumes or
    # credential env vars in the adapter pod spec.
    poll_file() {
        path="$1"
        until [ -r "$path" ] && [ -s "$path" ]; do
            sleep 1
        done
        cat "$path"
    }
    
    CRITERIA_REMOTE_HOST=$(poll_file "$run_dir/host")
    CRITERIA_REMOTE_TOKEN=$(poll_file "$run_dir/token")
    CRITERIA_REMOTE_DIGEST=$(poll_file "$run_dir/digest-$ADAPTER_KIND")
    
    export CRITERIA_REMOTE_HOST
    export CRITERIA_REMOTE_TOKEN
    export CRITERIA_REMOTE_DIGEST
    
    # Shell steps run git/gh commands; set a generic bot identity and the gh
    # credential helper so the adapter's own token is used for HTTPS clones.
    if [ "$ADAPTER_KIND" = "shell" ]; then
        git config --global credential.https://github.com.helper '!gh auth git-credential'
        git config --global user.name "criteria-runner"
        git config --global user.email "criteria-runner@brokenbots.invalid"
    fi
    
    # The adapter image entrypoint is the remote runner phone-home binary. All
    # credentials reach the adapter over the OpenSession SDK contract; this
    # wrapper exports only the connection/digest metadata from discovery files.
    exec /usr/local/bin/criteria-adapter-remote-runner
---
apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: criteria-run
    app.kubernetes.io/managed-by: criteria-k8s
    criteria.brokenbots.dev/run: __JOB_NAME__
    criteria.brokenbots.dev/role: runner
    ticket: __TICKET_ID__
spec:
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: criteria-run
        app.kubernetes.io/managed-by: criteria-k8s
        criteria.brokenbots.dev/run: __JOB_NAME__
        criteria.brokenbots.dev/role: runner
        ticket: __TICKET_ID__
    spec:
      serviceAccountName: criteria-runner
      automountServiceAccountToken: true
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
        - key: catch
          operator: Exists
          effect: NoSchedule
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: repo-clone
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              WORKFLOW_GITHUB_TOKEN=""
              if [ -r /home/criteria/secrets/workflow_github_token ]; then
                  WORKFLOW_GITHUB_TOKEN=$(cat /home/criteria/secrets/workflow_github_token)
              fi
              if [ -z "$WORKFLOW_GITHUB_TOKEN" ]; then
                  echo "WORKFLOW_GITHUB_TOKEN is required via /home/criteria/secrets/workflow_github_token" >&2
                  exit 1
              fi
              if [ -z "$REPO_URL" ]; then
                  echo "REPO_URL is required" >&2
                  exit 1
              fi
              find /repo -mindepth 1 -delete 2>/dev/null || true
              git config --global credential.https://github.com.helper '!gh auth git-credential'
              GH_TOKEN="$WORKFLOW_GITHUB_TOKEN" gh repo clone "$REPO_URL" /repo
          env:
            - name: REPO_URL
              value: "__REPO_URL__"
          volumeMounts:
            - name: repo
              mountPath: /repo
            - name: copilot-secrets
              mountPath: /home/criteria/secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      containers:
        - name: workflow-runner
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - /opt/criteria-pod-adapter/runner.sh
          env:
            - name: TICKET_ID
              value: "__TICKET_ID__"
            - name: REPO_URL
              value: "__REPO_URL__"
            - name: REPO_DIR
              value: "__REPO_DIR__"
            - name: INTAKE_ROOT
              value: "__INTAKE_ROOT__"
            - name: TRIAGE_ROOT
              value: "__TRIAGE_ROOT__"
            - name: LINEAR_REVIEW_STATE
              value: "__LINEAR_REVIEW_STATE__"
            - name: LINEAR_TRIAGE_STATE
              value: "__LINEAR_TRIAGE_STATE__"
            - name: LINEAR_WORK_STATE
              value: "__LINEAR_WORK_STATE__"
            - name: LINEAR_DONE_STATE
              value: "__LINEAR_DONE_STATE__"
            - name: BASE_BRANCH
              value: "__BASE_BRANCH__"
            - name: BUILD_CMD
              value: "__BUILD_CMD__"
            - name: TEST_CMD
              value: "__TEST_CMD__"
            - name: CI_GATE_CMD
              value: "__CI_GATE_CMD__"
            - name: TEST_REFS
              value: "__TEST_REFS__"
            - name: MAIN_REF
              value: "__MAIN_REF__"
            - name: STABLE_REF
              value: "__STABLE_REF__"
            - name: DESIGN_INTENT_FILE
              value: "__DESIGN_INTENT_FILE__"
            - name: REPRO_WORKFLOW_DIR
              value: "__REPRO_WORKFLOW_DIR__"
            - name: ALLOW_DIRTY
              value: "__ALLOW_DIRTY__"
            - name: MAX_AGENT_VISITS
              value: "__MAX_AGENT_VISITS__"
            - name: PROVIDER_BASE_URL
              value: "__PROVIDER_BASE_URL__"
            - name: EVENTS_FILE
              value: "__EVENTS_FILE__"
            - name: JOB_NAME
              value: "__JOB_NAME__"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: data
              mountPath: /data
            - name: repo
              mountPath: /repo
            - name: linear-secrets
              mountPath: /secrets/linear_api_key
              subPath: linear_api_key
            - name: copilot-secrets
              mountPath: /home/criteria/secrets
            - name: scripts
              mountPath: /opt/criteria-pod-adapter
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "8Gi"
              cpu: "4000m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: __DATA_PVC__
        - name: repo
          persistentVolumeClaim:
            claimName: __REPO_PVC__
        - name: linear-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: linear-spc
        - name: copilot-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: copilot-spc
        - name: scripts
          configMap:
            name: pod-adapter-scripts
            defaultMode: 0755
---
apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__-adapter-shell
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: criteria-run
