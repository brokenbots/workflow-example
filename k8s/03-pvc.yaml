# Persistent volumes for criteria runs.
# Uses the default local-path provisioner (hostPath on the control-plane node).
# criteria-data keeps intake/triage artifacts across runs; criteria-repo holds
# the cloned working repository (fresh clone per job when REPO_URL is set and
# the PVC is empty, reused otherwise).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: criteria-data
  namespace: criteria-jobs
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: criteria-repo
  namespace: criteria-jobs
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path