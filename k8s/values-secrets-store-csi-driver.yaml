# Values for the upstream secrets-store-csi-driver Helm chart.
# Tuned for the BrokenBots k3s catch node: run on amd64 Linux and tolerate
# both the catch taint and the control-plane taint.
linux:
  enabled: true
  nodeSelector:
    kubernetes.io/arch: amd64
  tolerations:
    - key: catch
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

# Disable the Windows daemonset; the catch node runs Linux.
windows:
  enabled: false
